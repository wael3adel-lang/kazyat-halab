<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">

<link rel="manifest" href="manifest.webmanifest">

<title>كازيات حلب</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
background:#f4f7f7;
color:#17202a
}

header{
background:#0f766e;
color:#fff;
padding:24px 15px
}

.wrap{
max-width:900px;
margin:auto
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.brand{
font-size:29px;
font-weight:900
}

.admin-message{
display:inline-block;
background:transparent;
color:#fff;
border:1px solid rgba(255,255,255,.65);
border-radius:999px;
padding:7px 11px;
font-size:12px;
font-weight:700;
text-decoration:none;
white-space:nowrap
}

.admin-message:hover{
background:rgba(255,255,255,.12)
}

.sub{
margin-top:5px;
opacity:.92
}

.credit{
margin-top:8px;
font-size:12px;
opacity:.75;
font-weight:600
}

.search{
margin-top:16px
}

.search input{
width:100%;
padding:14px;
border:0;
border-radius:13px;
font-size:16px;
outline:none
}

.filters{
display:flex;
gap:7px;
overflow:auto;
padding:14px 0
}

.filters button{
white-space:nowrap;
border:1px solid #d7dddd;
background:#fff;
border-radius:999px;
padding:9px 13px;
cursor:pointer;
font:inherit
}

.filters button.active{
background:#0f766e;
color:#fff;
border-color:#0f766e
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:10px
}

.stat{
background:#fff;
border-radius:12px;
padding:10px;
text-align:center
}

.stat b{
display:block;
font-size:21px
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:10px
}

.card{
background:#fff;
border:1px solid #e3e9e9;
border-radius:16px;
padding:15px;
box-shadow:0 2px 10px #0000000b
}

.name{
font-size:19px;
font-weight:850
}

.area{
font-size:13px;
color:#69767c;
margin-top:3px
}

.badges{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:11px
}

.badge{
padding:6px 9px;
border-radius:9px;
font-size:12px;
font-weight:750
}

.ok{
background:#dcfce7;
color:#166534
}

.no{
background:#fee2e2;
color:#991b1b
}

.warn{
background:#fef3c7;
color:#92400e
}

.gray{
background:#e5e7eb;
color:#374151
}

.time{
font-size:11px;
color:#777;
margin-top:10px
}

.note{
font-size:13px;
margin-top:9px;
line-height:1.6
}

.closure-info{
margin-top:10px;
background:#fff7ed;
color:#9a3412;
border-radius:10px;
padding:9px 10px;
font-size:13px;
font-weight:750;
line-height:1.8
}

.location-link{
display:inline-block;
margin-top:10px;
background:#ecfdf5;
color:#047857;
text-decoration:none;
border:1px solid #a7f3d0;
border-radius:10px;
padding:8px 11px;
font-size:13px;
font-weight:800
}

/* =========================
   التقييم
========================= */

.rating-box{
margin-top:13px;
padding-top:11px;
border-top:1px solid #eef2f2;
text-align:right
}

.rating-average{
font-size:13px;
font-weight:800;
color:#555
}

.stars{
margin-top:8px;
display:flex;
gap:4px;
direction:ltr;
justify-content:flex-start;
align-items:flex-start
}

.star-item{
text-align:center;
min-width:42px
}

.star{
border:0;
background:transparent;
font-size:27px;
padding:1px 3px;
cursor:pointer;
line-height:1;
transition:.15s
}

.star:hover{
transform:scale(1.12)
}

.star.selected{
transform:scale(1.12)
}

.star-number{
font-size:12px;
font-weight:800;
color:#555;
margin-top:1px
}

.rating-selected{
font-size:13px;
font-weight:700;
color:#0f766e;
margin-top:8px;
min-height:20px
}

.confirm-rating{
margin-top:9px;
border:0;
background:#0f766e;
color:#fff;
border-radius:10px;
padding:9px 16px;
font:inherit;
font-weight:800;
cursor:pointer
}

.confirm-rating:hover{
opacity:.9
}

.rating-message{
font-size:12px;
color:#0f766e;
margin-top:6px;
min-height:18px
}

/* =========================
   زر الشكوى
========================= */

.complaint-link{
display:inline-block;
margin-top:9px;
background:#fff1f2;
color:#be123c;
text-decoration:none;
border:1px solid #fecdd3;
border-radius:10px;
padding:8px 11px;
font-size:13px;
font-weight:800
}

.complaint-link:hover{
background:#ffe4e6
}

@media(max-width:600px){

.stats{
grid-template-columns:repeat(2,1fr)
}

.header-top{
align-items:flex-start
}

.brand{
font-size:27px
}

.admin-message{
font-size:11px;
padding:6px 9px
}

}

</style>

</head>

<body>

<header>

<div class="wrap">

<div class="header-top">

<div class="brand">
⛽ كازيات حلب
</div>

<a
class="admin-message"
href="https://wa.me/905050978000?text=مرحباً،%20لدي%20معلومات%20أو%20تحديث%20بخصوص%20كازيات%20حلب"
target="_blank"
rel="noopener">

📩 المشرف

</a>

</div>

<div class="sub">
حالة المحطات وآخر تحديثات الوقود
</div>

<div class="credit">
By Ammar Morgan
</div>

<div
class="sub"
id="updatedLine">

آخر تحديث: جاري التحميل…

</div>

<div class="search">

<input
id="search"
type="search"
placeholder="ابحث عن محطة أو منطقة…
