<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">

<link rel="manifest" href="manifest.webmanifest">

<title>كازيات حلب</title>

<style>

/* =========================
   الأساس
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:#f3f6f6;
    color:#17202a;
}

.wrap{
    width:min(900px,calc(100% - 24px));
    margin:auto;
}

/* =========================
   الهيدر
========================= */

header{
    background:#0f766e;
    color:#fff;
    padding:18px 0 16px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.brand{
    font-size:25px;
    font-weight:900;
}

.admin-message{
    display:inline-block;
    color:#fff;
    border:1px solid rgba(255,255,255,.65);
    border-radius:999px;
    padding:6px 10px;
    font-size:11px;
    font-weight:700;
    text-decoration:none;
    white-space:nowrap;
}

.sub{
    margin-top:4px;
    opacity:.9;
    font-size:13px;
}

.credit{
    margin-top:5px;
    font-size:10px;
    opacity:.7;
}

.updated-line{
    margin-top:7px;
    font-size:11px;
    opacity:.9;
}

.search{
    margin-top:12px;
}

.search input{
    width:100%;
    padding:12px 14px;
    border:0;
    border-radius:12px;
    font-size:14px;
    outline:none;
}

/* =========================
   الفلاتر
========================= */

.filters{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:10px 0;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filters button{
    white-space:nowrap;
    border:1px solid #d6dddd;
    background:#fff;
    border-radius:999px;
    padding:7px 12px;
    cursor:pointer;
    font:inherit;
    font-size:12px;
    color:#17202a;
}

.filters button.active{
    background:#0f766e;
    color:#fff;
    border-color:#0f766e;
}

/* =========================
   الإحصائيات
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin:8px 0;
}

.stat{
    background:#fff;
    border:1px solid #e1e7e7;
    border-radius:11px;
    padding:7px 4px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:18px;
    line-height:1.2;
}

.stat span{
    display:block;
    margin-top:2px;
    font-size:10px;
    color:#69757a;
}

.count-row{
    margin:3px 2px 8px;
    font-size:11px;
    color:#68757a;
}

/* =========================
   شبكة المحطات
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:8px;
}

/* =========================
   بطاقة المحطة
========================= */

.station-card{
    background:#fff;
    border-radius:15px;
    border:2px solid #dce5e4;
    overflow:hidden;
    cursor:pointer;
    transition:.15s;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
}

.station-card:hover{
    transform:translateY(-1px);
}

.station-card.open{
    border-color:#86efac;
}

.station-card.closed{
    border-color:#fca5a5;
}

/* =========================
   الرأس
========================= */

.station-main{
    padding:12px 13px;
}

.station-head{
    display:flex;
    align-items:center;
    gap:8px;
}

.status-circle{
    width:11px;
    height:11px;
    min-width:11px;
    border-radius:50%;
}

.status-circle.green{
    background:#22c55e;
}

.status-circle.red{
    background:#ef4444;
}

.station-name{
    font-size:18px;
    font-weight:900;
    line-height:1.3;
}

.station-area{
    color:#68757a;
    font-size:11px;
    margin-top:2px;
    padding-right:19px;
}

/* =========================
   البنزين والمازوت
========================= */

.fuel-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:11px;
}

.fuel-item{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:#f8fafb;
    border-radius:9px;
    padding:8px 5px;
    font-size:12px;
    font-weight:800;
}

.fuel-dot{
    width:10px;
    height:10px;
    border-radius:50%;
}

.fuel-dot.yes{
    background:#22c55e;
}

.fuel-dot.no{
    background:#ef4444;
}

/* =========================
   تفاصيل البطاقة
========================= */

.station-details{
    display:none;
    border-top:1px solid #e5eaea;
    background:#fafcfc;
    padding:11px 13px;
}

.station-card.expanded .station-details{
    display:block;
}

/* =========================
   أزرار التفاصيل
========================= */

.detail-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.detail-button{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    border:0;
    border-radius:8px;
    padding:8px 4px;
    font:inherit;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
}

.location-button{
    background:#ecfdf5;
    color:#047857;
    border:1px solid #a7f3d0;
}

.message-button{
    background:#eff6ff;
    color:#1d4ed8;
    border:1px solid #bfdbfe;
}

.rating-button{
    background:#fff7ed;
    color:#c2410c;
    border:1px solid #fed7aa;
}

/* =========================
   الازدحام
========================= */

.traffic-box{
    margin-top:8px;
    padding:7px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:800;
    text-align:center;
}

.traffic-none{
    background:#dcfce7;
    color:#166534;
}

.traffic-light{
    background:#fef3c7;
    color:#92400e;
}

.traffic-long{
    background:#fee2e2;
    color:#991b1b;
}

/* =========================
   الإغلاق
========================= */

.closure-box{
    margin-top:8px;
    background:#fff7ed;
    color:#9a3412;
    border-radius:8px;
    padding:8px 9px;
    font-size:11px;
    line-height:1.6;
    font-weight:700;
}

/* =========================
   الملاحظة
========================= */

.note-box{
    margin-top:8px;
    background:#f1f5f9;
    color:#475569;
    border-radius:8px;
    padding:8px 9px;
    font-size:11px;
    line-height:1.6;
}

/* =========================
   التقييم
========================= */

.rating-section{
    margin-top:9px;
    padding-top:9px;
    border-top:1px solid #e5eaea;
}

.rating-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
}

.rating-average{
    font-size:11px;
    color:#555;
    font-weight:800;
}

.rating-toggle{
    border:0;
    background:#fff;
    color:#0f766e;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    padding:4px 7px;
    border-radius:7px;
}

.rating-content{
    display:none;
    margin-top:7px;
}

.rating-content.show{
    display:block;
}

.stars{
    display:flex;
    direction:ltr;
    justify-content:center;
    gap:2px;
}

.star{
    border:0;
    background:transparent;
    font-size:22px;
    line-height:1;
    padding:2px;
    cursor:pointer;
}

.rating-selected{
    text-align:center;
    font-size:10px;
    color:#0f766e;
    font-weight:700;
    min-height:15px;
    margin-top:4px;
}

.confirm-rating{
    display:none;
    border:0;
    background:#0f766e;
    color:#fff;
    border-radius:7px;
    padding:6px 10px;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
    margin:5px auto 0;
}

.rating-message{
    text-align:center;
    color:#0f766e;
    font-size:10px;
    min-height:14px;
    margin-top:4px;
}

/* =========================
   آخر تحديث
========================= */

.station-time{
    margin-top:8px;
    text-align:left;
    color:#888;
    font-size:9px;
}

/* =========================
   لا توجد نتائج
========================= */

.empty{
    background:#fff;
    border:1px solid #e1e7e7;
    border-radius:14px;
    padding:30px 15px;
    text-align:center;
    color:#777;
}

/* =========================
   الهاتف
========================= */

@media(max-width:600px){

    .wrap{
        width:calc(100% - 18px);
    }

    header{
        padding:15px 0 13px;
    }

    .brand{
        font-size:22px;
    }

    .admin-message{
        font-size:9px;
        padding:5px 8px;
    }

    .sub{
        font-size:12px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:7px;
    }

    .station-main{
        padding:11px 12px;
    }

    .station-name{
        font-size:17px;
    }

    .station-area{
        font-size:10px;
    }

    .fuel-item{
        padding:7px 4px;
        font-size:11px;
    }

    .detail-actions{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:380px){

    .brand{
        font-size:20px;
    }

    .station-name{
        font-size:16px;
    }

    .fuel-item{
        font-size:10px;
    }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   Supabase
========================= */

const sb=supabase.createClient(

"https://hjggfolotblsurfwfcvn.supabase.co",

"sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl"

);


/* =========================
   المتغيرات
========================= */

let all=[];

let filter="all";

let regionFilter="city";

const ratings={};

const selectedRatings={};

const $=id=>document.getElementById(id);


/* =========================
   حماية النصوص
========================= */

function esc(x){

return String(x??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m]));

}


/* =========================
   التاريخ
========================= */

function fmt(t){

if(!t)
return "—";

const d=new Date(t);

if(isNaN(d.getTime()))
return "—";

return new Intl.DateTimeFormat(
"ar-SY",
{
day:"numeric",
month:"numeric",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
).format(d);

}


/* =========================
   سبب الإغلاق
========================= */

function closureReasonText(v){

const value=
String(v??"")
.trim()
.toLowerCase();

if(value==="maintenance")
return "🔧 صيانة";

if(value==="technical")
return "⚡ عطل فني";

if(value==="delivery")
return "🚚 بانتظار وصول الطلبية";

if(value==="fuel")
return "⛽ نفاد الوقود";

if(value==="administrative")
return "🏢 إغلاق إداري";

if(value==="temporary")
return "🕐 إغلاق مؤقت";

return "";

}


/* =========================
   الازدحام
========================= */

function trafficInfo(v){

const value=
String(v??"")
.trim()
.toLowerCase();

if(value==="none"){

return {
text:"🟢 لا يوجد ازدحام",
className:"traffic-none"
};

}

if(value==="light"){

return {
text:"🟡 ازدحام خفيف",
className:"traffic-light"
};

}

if(value==="long"){

return {
text:"🔴 طابور طويل",
className:"traffic-long"
};

}

return null;

}


/* =========================
   المنطقة
   ندعم region و region_type
========================= */

function getRegion(s){

const value=
String(
s.region_type ??
s.region ??
""
)
.trim()
.toLowerCase();

if(value==="countryside")
return "countryside";

return "city";

}


/* =========================
   فتح وإغلاق البطاقة
========================= */

function toggleStation(stationId){

const card=
document.getElementById(
"station-"+CSS.escape(String(stationId))
);

if(!card)
return;

card.classList.toggle("expanded");

}


/* =========================
   الموقع
========================= */

function locationButton(s){

if(!s.location_url)
return "";

return `

<a
class="detail-button location-button"
href="${esc(s.location_url)}"
target="_blank"
rel="noopener"
onclick="event.stopPropagation()">

📍 الموقع

</a>

`;

}


/* =========================
   الرسالة / الشكوى
========================= */

function messageButton(s){

const stationName=
String(s.name??"محطة");

const text=
`مرحباً، لدي رسالة بخصوص ${stationName}

الرسالة:`;

const url=
"https://wa.me/905050978000?text="+
encodeURIComponent(text);

return `

<a
class="detail-button message-button"
href="${url}"
target="_blank"
rel="noopener"
onclick="event.stopPropagation()">

📩 رسالة

</a>

`;

}


/* =========================
   صندوق التقييم
========================= */

function ratingBox(s){

const id=String(s.id);

const r=
ratings[id] ||
{
average:0,
count:0
};

const average=
Number(r.average||0).toFixed(1);

const count=
Number(r.count||0);

return `

<div
class="rating-section"
onclick="event.stopPropagation()">

<div class="rating-top">

<div class="rating-average">

⭐ ${average} / 5
${count ? ` • ${count} تقييم` : " • لا يوجد تقييم"}

</div>

<button
class="rating-toggle"
type="button"
onclick="toggleRating('${esc(id)}')">

⭐ تقييم المحطة

</button>

</div>


<div
class="rating-content"
id="rating-content-${esc(id)}">

<div class="stars">

${[1,2,3,4,5].map(n=>`

<button
class="star"
onclick="selectRating('${esc(id)}',${n})"
id="star-${esc(id)}-${n}"
title="تقييم ${n} من 5">

☆

</button>

`).join("")}

</div>


<div
class="rating-selected"
id="rating-selected-${esc(id)}">

اختر تقييمك من 1 إلى 5

</div>


<button
class="confirm-rating"
id="confirm-rating-${esc(id)}"
onclick="confirmRating('${esc(id)}')">

✅ تأكيد التقييم

</button>


<div
class="rating-message"
id="rating-message-${esc(id)}">
</div>

</div>

</div>

`;

}


/* =========================
   فتح التقييم
========================= */

function toggleRating(stationId){

const box=
document.getElementById(
"rating-content-"+stationId
);

if(!box)
return;

box.classList.toggle("show");

}


/* =========================
   اختيار التقييم
========================= */

function selectRating(stationId,rating){

selectedRatings[stationId]=rating;

const selected=
document.getElementById(
"rating-selected-"+stationId
);

if(selected){

selected.textContent=
"اخترت ⭐ "+rating+" من 5";

}

for(let n=1;n<=5;n++){

const star=
document.getElementById(
"star-"+stationId+"-"+n
);

if(star){

star.textContent=
n<=rating
?
"⭐"
:
"☆";

}

}

const confirm=
document.getElementById(
"confirm-rating-"+stationId
);

if(confirm){

confirm.style.display="block";

}

}


/* =========================
   تأكيد التقييم
========================= */

async function confirmRating(stationId){

const rating=
selectedRatings[stationId];

if(!rating)
return;

const message=
document.getElementById(
"rating-message-"+stationId
);

if(message){

message.textContent=
"جاري إرسال التقييم…";

}

const storageKey=
"rated_station_"+stationId;

if(localStorage.getItem(storageKey)){

if(message){

message.textContent=
"⚠️ لقد قيّمت هذه المحطة مسبقاً من هذا الجهاز.";

}

return;

}

const {error}=
await sb
.from("station_ratings")
.insert({

station_id:stationId,

rating:Number(rating)

});

if(error){

console.error(error);

if(message){

message.textContent=
"تعذر إرسال التقييم، حاول مرة أخرى.";

}

return;

}

localStorage.setItem(
storageKey,
"1"
);

if(message){

message.textContent=
"✅ تم تسجيل تقييمك.";

}

delete selectedRatings[stationId];

await loadRatings();

await render();

}


/* =========================
   مطابقة الفلاتر
========================= */

function stationMatchesFilter(s){

const status=
String(s.status??"")
.trim()
.toLowerCase();

const gas=
String(s.gas??"")
.trim()
.toLowerCase();

const diesel=
String(s.diesel??"")
.trim()
.toLowerCase();

const traffic=
String(s.traffic??"")
.trim()
.toLowerCase();

const region=
getRegion(s);


/* المنطقة */

if(regionFilter==="countryside"){

if(region!=="countryside")
return false;

}else{

if(region==="countryside")
return false;

}


/* الحالة */

if(filter==="open")
return status==="open";

if(filter==="closed")
return status==="closed";

if(filter==="both"){

return (
status==="open" &&
gas==="yes" &&
diesel==="yes"
);

}

if(filter==="gas"){

return (
status==="open" &&
gas==="yes"
);

}

if(filter==="diesel"){

return (
status==="open" &&
diesel==="yes"
);

}

if(filter==="none"){

return (
status==="open" &&
traffic==="none"
);

}

if(filter==="long"){

return (
status==="open" &&
traffic==="long"
);

}

if(filter==="light"){

return (
status==="open" &&
traffic==="light"
);

}

return true;

}


/* =========================
   تحميل التقييمات
========================= */

async function loadRatings(){

try{

const {data,error}=
await sb
.from("station_ratings")
.select("station_id,rating");

if(error){

console.log(
"Ratings error:",
error.message
);

return;

}

Object.keys(ratings)
.forEach(
k=>delete ratings[k]
);

(data||[]).forEach(row=>{

const id=String(row.station_id);

if(!ratings[id]){

ratings[id]={
total:0,
count:0,
average:0
};

}

ratings[id].total +=
Number(row.rating)||0;

ratings[id].count +=1;

ratings[id].average=
ratings[id].count
?
ratings[id].total /
ratings[id].count
:
0;

});

}catch(e){

console.error(e);

}

}


/* =========================
   رسم المحطات
========================= */

async function render(){

const q=
$("search")
.value
.trim()
.toLowerCase();

const a=
all.filter(s=>{

const name=
String(s.name??"")
.toLowerCase();

const area=
String(s.area??"")
.toLowerCase();

if(
q &&
!((name+" "+area).includes(q))
){

return false;

}

return stationMatchesFilter(s);

});


/* الإحصائيات */

const total=a.length;

const open=
a.filter(s=>
String(s.status??"")
.trim()
.toLowerCase()==="open"
).length;

const closed=
a.filter(s=>

</div>

`;

$("updatedLine").textContent=
"تعذر تحميل البيانات";

return;

}

all=data||[];


/* آخر تحديث */

if(all.length){

const valid=
all.filter(
s=>s.updated_at
);

if(valid.length){

const latest=
valid.reduce(
(a,b)=>
new Date(a.updated_at)>
new Date(b.updated_at)
?
a
:
b
);

$("updatedLine").textContent=
"آخر تحديث: "+
fmt(latest.updated_at);

}else{

$("updatedLine").textContent=
"آخر تحديث: —";

}

}else{

$("updatedLine").textContent=
"آخر تحديث: —";

}


await loadRatings();

console.error(error);

$("stations").innerHTML=`

حاول تحديث الصفحة.

$("updatedLine").textContent=
"تعذر تحميل البيانات";

}

}
