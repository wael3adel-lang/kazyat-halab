<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">

<link rel="manifest" href="manifest.webmanifest">

<title>كازيات حلب</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:#f3f6f6;
    color:#17202a;
}

.wrap{
    width:min(900px,calc(100% - 18px));
    margin:auto;
}

/* =========================
   الهيدر
========================= */

header{
    background:#0f766e;
    color:#fff;
    padding:16px 0 14px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.brand{
    font-size:24px;
    font-weight:900;
}

.admin-message{
    display:inline-block;
    color:#fff;
    border:1px solid rgba(255,255,255,.65);
    border-radius:999px;
    padding:5px 9px;
    font-size:10px;
    font-weight:700;
    text-decoration:none;
    white-space:nowrap;
}

.sub{
    margin-top:4px;
    opacity:.9;
    font-size:12px;
}

.credit{
    margin-top:4px;
    font-size:10px;
    opacity:.7;
}

.updated-line{
    margin-top:6px;
    font-size:11px;
    opacity:.95;
}

.search{
    margin-top:10px;
}

.search input{
    width:100%;
    padding:11px 13px;
    border:0;
    border-radius:11px;
    font-size:14px;
    outline:none;
}

/* =========================
   الفلاتر
========================= */

.filters{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:9px 0;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filters button{
    white-space:nowrap;
    border:1px solid #d6dddd;
    background:#fff;
    border-radius:999px;
    padding:7px 11px;
    cursor:pointer;
    font:inherit;
    font-size:12px;
    color:#17202a;
}

.filters button.active{
    background:#0f766e;
    color:#fff;
    border-color:#0f766e;
}

/* =========================
   الإحصائيات
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    margin:7px 0;
}

.stat{
    background:#fff;
    border:1px solid #e1e7e7;
    border-radius:10px;
    padding:6px 3px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:17px;
    line-height:1.2;
}

.stat span{
    display:block;
    margin-top:2px;
    font-size:9px;
    color:#69757a;
}

.count-row{
    margin:3px 2px 7px;
    font-size:10px;
    color:#68757a;
}

/* =========================
   شبكة المحطات
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
}

/* =========================
   بطاقة المحطة
========================= */

.station-card{
    background:#fff;
    border-radius:13px;
    border:2px solid #dce5e4;
    overflow:hidden;
    cursor:pointer;
    transition:.15s;
    box-shadow:0 2px 6px rgba(0,0,0,.04);
    min-width:0;
}

.station-card.open{
    border-color:#86efac;
}

.station-card.closed{
    border-color:#fca5a5;
}

.station-card:active{
    transform:scale(.985);
}

/* =========================
   الجزء الرئيسي
========================= */

.station-main{
    padding:10px;
}

.station-head{
    display:flex;
    align-items:flex-start;
    gap:6px;
}

.status-circle{
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
    margin-top:5px;
}

.status-circle.green{
    background:#22c55e;
}

.status-circle.red{
    background:#ef4444;
}

.station-name{
    font-size:15px;
    font-weight:900;
    line-height:1.25;
}

.station-area{
    color:#68757a;
    font-size:9px;
    margin-top:2px;
    padding-right:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   البنزين والمازوت
========================= */

.fuel-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-top:9px;
}

.fuel-item{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    background:#f8fafb;
    border-radius:8px;
    padding:7px 3px;
    font-size:10px;
    font-weight:800;
}

.fuel-dot{
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
}

.fuel-dot.yes{
    background:#22c55e;
}

.fuel-dot.no{
    background:#ef4444;
}

/* =========================
   التفاصيل
========================= */

.station-details{
    display:none;
    border-top:1px solid #e5eaea;
    background:#fafcfc;
    padding:9px 10px;
}

.station-card.expanded .station-details{
    display:block;
}

/* =========================
   أزرار التفاصيل
========================= */

.detail-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.detail-button{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    border:0;
    border-radius:7px;
    padding:7px 3px;
    font:inherit;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
}

.location-button{
    background:#ecfdf5;
    color:#047857;
    border:1px solid #a7f3d0;
}

.message-button{
    background:#eff6ff;
    color:#1d4ed8;
    border:1px solid #bfdbfe;
}

.rating-button{
    background:#fff7ed;
    color:#c2410c;
    border:1px solid #fed7aa;
}

/* =========================
   الازدحام
========================= */

.traffic-box{
    margin-top:7px;
    padding:6px 7px;
    border-radius:7px;
    font-size:10px;
    font-weight:800;
    text-align:center;
}

.traffic-none{
    background:#dcfce7;
    color:#166534;
}

.traffic-light{
    background:#fef3c7;
    color:#92400e;
}

.traffic-long{
    background:#fee2e2;
    color:#991b1b;
}

/* =========================
   الإغلاق
========================= */

.closure-box{
    margin-top:7px;
    background:#fff1f2;
    color:#991b1b;
    border-radius:7px;
    padding:7px 8px;
    font-size:10px;
    line-height:1.6;
    font-weight:800;
}

/* =========================
   الملاحظة
========================= */

.note-box{
    margin-top:7px;
    background:#f1f5f9;
    color:#475569;
    border-radius:7px;
    padding:7px 8px;
    font-size:10px;
    line-height:1.6;
}

/* =========================
   التقييم
========================= */

.rating-section{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid #e5eaea;
}

.rating-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
}

.rating-average{
    font-size:10px;
    color:#555;
    font-weight:800;
}

.rating-toggle{
    border:0;
    background:#fff;
    color:#0f766e;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
    padding:4px 6px;
    border-radius:6px;
}

.rating-content{
    display:none;
    margin-top:6px;
}

.rating-content.show{
    display:block;
}

.stars{
    display:flex;
    direction:ltr;
    justify-content:center;
    gap:1px;
}

.star{
    border:0;
    background:transparent;
    font-size:21px;
    line-height:1;
    padding:2px;
    cursor:pointer;
}

.rating-selected{
    text-align:center;
    font-size:9px;
    color:#0f766e;
    font-weight:700;
    min-height:14px;
    margin-top:3px;
}

.confirm-rating{
    display:none;
    border:0;
    background:#0f766e;
    color:#fff;
    border-radius:6px;
    padding:6px 9px;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
    margin:4px auto 0;
}

.rating-message{
    text-align:center;
    color:#0f766e;
    font-size:9px;
    min-height:13px;
    margin-top:3px;
}

/* =========================
   الوقت
========================= */

.station-time{
    margin-top:7px;
    text-align:left;
    color:#888;
    font-size:8px;
}

/* =========================
   لا نتائج
========================= */

.empty{
    grid-column:1 / -1;
    background:#fff;
    border:1px solid #e1e7e7;
    border-radius:13px;
    padding:30px 15px;
    text-align:center;
    color:#777;
}

/* =========================
   الهاتف
========================= */

@media(max-width:600px){

    .wrap{
        width:calc(100% - 12px);
    }

    header{
        padding:14px 0 12px;
    }

    .brand{
        font-size:21px;
    }

    .admin-message{
        font-size:9px;
        padding:5px 7px;
    }

    .sub{
        font-size:11px;
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
    }

    .station-main{
        padding:9px;
    }

    .station-name{
        font-size:14px;
    }

    .station-area{
        font-size:8px;
        padding-right:14px;
    }

    .fuel-row{
        gap:4px;
        margin-top:8px;
    }

    .fuel-item{
        padding:6px 2px;
        font-size:9px;
    }

    .fuel-dot{
        width:8px;
        height:8px;
        min-width:8px;
    }

    .detail-actions{
        grid-template-columns:repeat(3,1fr);
    }

    .detail-button{
        font-size:8px;
        padding:6px 2px;
    }

}

@media(max-width:360px){

    .brand{
        font-size:19px;
    }

    .station-name{
        font-size:13px;
    }

    .station-main{
        padding:8px;
    }

    .fuel-item{
        font-size:8px;
    }

}

/* =========================
   شاشة أكبر
========================= */

@media(min-width:601px){

    .grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .station-name{
        font-size:16px;
    }

}

</style>
</head>


<body>

<header>

<div class="wrap">

<div class="header-top">

<div class="brand">
⛽ كازيات حلب
</div>

<a
class="admin-message"
href="https://wa.me/905050978000?text=مرحباً،%20لدي%20معلومات%20أو%20تحديث%20بخصوص%20كازيات%20حلب"
target="_blank"
rel="noopener">

📩 المشرف

</a>

</div>


<div class="sub">
حالة المحطات وآخر تحديثات الوقود
</div>


<div class="credit">
By Ammar Morgan
</div>


<div
class="updated-line"
id="updatedLine">

آخر تحديث: جاري التحميل…

</div>


<div class="search">

<input
id="search"
type="search"
placeholder="ابحث عن محطة أو منطقة…"
autocomplete="off">

</div>

</div>

</header>


<main class="wrap">


<div
class="stats"
id="stats">
</div>


<!-- المناطق -->

<div class="filters">

<button
class="active"
data-region="city">

🏙️ حلب المدينة

</button>


<button
data-region="countryside">

🏡 ريف حلب

</button>

</div>


<!-- الفلاتر -->

<div class="filters">

<button
class="active"
data-f="all">

الكل

</button>

<button data-f="open">
تعمل
</button>

<button data-f="both">
بنزين + مازوت
</button>

<button data-f="gas">
بنزين
</button>

<button data-f="diesel">
مازوت
</button>

<button data-f="closed">
مغلقة
</button>

<button data-f="none">

</button>

<button data-f="long">
طابور طويل
</button>

<button data-f="light">
ازدحام خفيف
</button>

</div>


<div
class="count-row"
id="count">

جاري تحميل المحطات…

</div>

id="stations">

جاري تحميل المحطات…
</div>

</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   Supabase
========================= */

const sb = supabase.createClient(

    "https://hjggfolotblsurfwfcvn.supabase.co",

    "sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl"

);


/* =========================
   المتغيرات
========================= */

let all = [];

let filter = "all";

let regionFilter = "city";

const ratings = {};

const selectedRatings = {};

const $ = id => document.getElementById(id);


/* =========================
   حماية النصوص
========================= */

function esc(x){

    return String(x ?? "")
        .replace(/[&<>"']/g, m => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[m]));

}


/* =========================
   التاريخ
========================= */

function fmt(t){

    if(!t){
        return "—";
    }

    const d = new Date(t);

    if(isNaN(d.getTime())){
        return "—";
    }

    return new Intl.DateTimeFormat(
        "ar-SY",
        {
            day:"numeric",
            month:"numeric",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    ).format(d);

}


/* =========================
   سبب الإغلاق
========================= */

function closureReasonText(v){

    const value =
        String(v ?? "")
        .trim()
        .toLowerCase();

    if(value === "maintenance")
        return "🔧 صيانة";

    if(value === "technical")
        return "⚡ عطل فني";

    if(value === "delivery")
        return "🚚 بانتظار وصول الطلبية";

    if(value === "fuel")
        return "⛽ نفاد الوقود";

    if(value === "administrative")
        return "🏢 إغلاق إداري";

    if(value === "temporary")
        return "🕐 إغلاق مؤقت";

    return String(v ?? "");

}


/* =========================
   الازدحام
========================= */

function trafficInfo(v){

    const value =
        String(v ?? "")
        .trim()
        .toLowerCase();

    if(value === "none"){

        return {
            text:"🟢 لا يوجد ازدحام",
            className:"traffic-none"
        };

    }

    if(value === "light"){

        return {
            text:"🟡 ازدحام خفيف",
            className:"traffic-light"
        };

    }

    if(value === "long"){

        return {
            text:"🔴 طابور طويل",
            className:"traffic-long"
        };

    }

    return null;

}


/* =========================
   المنطقة
========================= */

function getRegion(s){

    const value =
        String(
            s.region_type ??
            s.region ??
            ""
        )
        .trim()
        .toLowerCase();

    if(value === "countryside"){
        return "countryside";
    }

    return "city";

}


/* =========================
   فتح / إغلاق المحطة
========================= */

function toggleStation(stationId){

    const safeId = String(stationId);

    const card =
        document.getElementById(
            "station-" + safeId
        );

    if(!card){
        return;
    }

    card.classList.toggle("expanded");

}


/* =========================
   زر الموقع
========================= */

function locationButton(s){

    if(!s.location_url){
        return "";
    }

    return `
        <a
            class="detail-button location-button"
            href="${esc(s.location_url)}"
            target="_blank"
            rel="noopener"
            onclick="event.stopPropagation()">

            📍 الموقع

        </a>
    `;

}


/* =========================
   زر الرسالة
========================= */

function messageButton(s){

    const stationName =
        String(s.name ?? "محطة");

    const text =
        `مرحباً، لدي رسالة بخصوص ${stationName}

الرسالة:`;

    const url =
        "https://wa.me/905050978000?text=" +
        encodeURIComponent(text);

    return `
        <a
            class="detail-button message-button"
            href="${url}"
            target="_blank"
            rel="noopener"
            onclick="event.stopPropagation()">

            📩 رسالة

        </a>
    `;

}


/* =========================
   صندوق التقييم
========================= */

function ratingBox(s){

    const id = String(s.id);

    const r =
        ratings[id] ||
        {
            average:0,
            count:0
        };

    const average =
        Number(r.average || 0).toFixed(1);

    const count =
        Number(r.count || 0);

    return `

        <div
            class="rating-section"
            onclick="event.stopPropagation()">

            <div class="rating-top">

                <div class="rating-average">

                    ⭐ ${average} / 5
                    ${count
                        ? ` • ${count} تقييم`
                        : " • لا يوجد تقييم"
                    }

                </div>


                <button
                    class="rating-toggle"
                    type="button"
                    onclick="toggleRating('${esc(id)}')">

                    ⭐ تقييم المحطة

                </button>

            </div>


            <div
                class="rating-content"
                id="rating-content-${esc(id)}">

                <div class="stars">

                    ${[1,2,3,4,5].map(n => `

                        <button
                            class="star"
                            onclick="selectRating('${esc(id)}',${n})"
                            id="star-${esc(id)}-${n}"
                            title="تقييم ${n} من 5">

                            ☆

                        </button>

                    `).join("")}

                </div>


                <div
                    class="rating-selected"
                    id="rating-selected-${esc(id)}">

                    اختر تقييمك من 1 إلى 5

                </div>


                <button
                    class="confirm-rating"
                    id="confirm-rating-${esc(id)}"
                    onclick="confirmRating('${esc(id)}')">

                    ✅ تأكيد التقييم

                </button>


                <div
                    class="rating-message"
                    id="rating-message-${esc(id)}">

                </div>

            </div>

        </div>

    `;

}


/* =========================
   فتح التقييم
========================= */

function toggleRating(stationId){

    const box =
        document.getElementById(
            "rating-content-" + stationId
        );

    if(!box){
        return;
    }

    box.classList.toggle("show");

}


/* =========================
   اختيار التقييم
========================= */

function selectRating(stationId,rating){

    selectedRatings[stationId] = rating;

    const selected =
        document.getElementById(
            "rating-selected-" + stationId
        );

    if(selected){

        selected.textContent =
            "اخترت ⭐ " +
            rating +
            " من 5";

    }


    for(let n = 1; n <= 5; n++){

        const star =
            document.getElementById(
                "star-" +
                stationId +
                "-" +
                n
            );

        if(star){

            star.textContent =
                n <= rating
                    ? "⭐"
                    : "☆";

        }

    }


    const confirm =
        document.getElementById(
            "confirm-rating-" + stationId
        );

    if(confirm){

        confirm.style.display =
            "block";

    }

}


/* =========================
   تأكيد التقييم
========================= */

async function confirmRating(stationId){

    const rating =
        selectedRatings[stationId];

    if(!rating){
        return;
    }


    const message =
        document.getElementById(
            "rating-message-" + stationId
        );

    if(message){

        message.textContent =
            "جاري إرسال التقييم…";

    }


    const storageKey =
        "rated_station_" + stationId;


    if(localStorage.getItem(storageKey)){

        if(message){

            message.textContent =
                "⚠️ لقد قيّمت هذه المحطة مسبقاً من هذا الجهاز.";

        }

        return;

    }


    try{

        const { error } =
            await sb
            .from("station_ratings")
            .insert({

                station_id:Number(stationId),

                rating:Number(rating)

            });


        if(error){

            console.error(error);

            if(message){

                message.textContent =
                    "تعذر إرسال
