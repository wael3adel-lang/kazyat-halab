<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">

<link rel="manifest" href="manifest.webmanifest">

<title>كازيات حلب</title>

<style>

/* =========================
   الأساس
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:#f4f7f7;
    color:#17202a;
}

.wrap{
    max-width:900px;
    margin:auto;
}

/* =========================
   الهيدر
========================= */

header{
    background:#0f766e;
    color:#fff;
    padding:20px 14px 18px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.brand{
    font-size:28px;
    font-weight:900;
}

.admin-message{
    display:inline-block;
    background:transparent;
    color:#fff;
    border:1px solid rgba(255,255,255,.65);
    border-radius:999px;
    padding:6px 10px;
    font-size:11px;
    font-weight:700;
    text-decoration:none;
    white-space:nowrap;
}

.admin-message:hover{
    background:rgba(255,255,255,.12);
}

.sub{
    margin-top:4px;
    opacity:.92;
    font-size:14px;
    font-weight:600;
}

.credit{
    margin-top:6px;
    font-size:11px;
    opacity:.75;
    font-weight:600;
}

.updated-line{
    margin-top:6px;
    font-size:12px;
    opacity:.95;
}

/* =========================
   البحث
========================= */

.search{
    margin-top:14px;
}

.search input{
    width:100%;
    padding:13px 15px;
    border:0;
    border-radius:13px;
    font-size:15px;
    outline:none;
}

/* =========================
   المنطقة
========================= */

.filters{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:12px 0;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filters button{
    white-space:nowrap;
    border:1px solid #d7dddd;
    background:#fff;
    border-radius:999px;
    padding:8px 13px;
    cursor:pointer;
    font:inherit;
    font-size:14px;
    color:#17202a;
}

.filters button.active{
    background:#0f766e;
    color:#fff;
    border-color:#0f766e;
}

/* =========================
   الإحصائيات
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin:10px 0 5px;
}

.stat{
    background:#fff;
    border-radius:12px;
    padding:8px 5px;
    text-align:center;
    border:1px solid #e5eaea;
}

.stat b{
    display:block;
    font-size:19px;
    line-height:1.2;
}

.stat span{
    display:block;
    margin-top:2px;
    font-size:11px;
    color:#5f6b70;
}

/* =========================
   العدد
========================= */

.count-row{
    margin:2px 2px 9px;
    font-size:12px;
    color:#68757a;
}

/* =========================
   البطاقات
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:10px;
}

.card{
    background:#fff;
    border:1px solid #e2e8e8;
    border-radius:16px;
    padding:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.045);
}

/* =========================
   رأس البطاقة
========================= */

.card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.name{
    font-size:19px;
    font-weight:900;
    line-height:1.35;
}

.area{
    font-size:12px;
    color:#69767c;
    margin-top:2px;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
    margin-left:4px;
    vertical-align:middle;
}

.status-dot.green{
    background:#22c55e;
}

.status-dot.red{
    background:#ef4444;
}

/* =========================
   المعلومات المهمة
========================= */

.main-info{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:11px;
}

.info-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:7px 9px;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
    line-height:1.1;
}

.ok{
    background:#dcfce7;
    color:#166534;
}

.no{
    background:#fee2e2;
    color:#991b1b;
}

.warn{
    background:#fef3c7;
    color:#92400e;
}

.gray{
    background:#e5e7eb;
    color:#374151;
}

/* =========================
   الازدحام - بارز
========================= */

.traffic-badge{
    font-weight:900;
}

/* =========================
   الموقع
========================= */

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

.location-link,
.complaint-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    border-radius:9px;
    padding:7px 10px;
    font-size:12px;
    font-weight:800;
}

.location-link{
    background:#ecfdf5;
    color:#047857;
    border:1px solid #a7f3d0;
}

.location-link:hover{
    background:#d1fae5;
}

.complaint-link{
    background:#fff1f2;
    color:#be123c;
    border:1px solid #fecdd3;
}

.complaint-link:hover{
    background:#ffe4e6;
}

/* =========================
   الملاحظة
========================= */

.note{
    font-size:12px;
    margin-top:9px;
    line-height:1.6;
    color:#4b5563;
    background:#f8fafc;
    padding:7px 9px;
    border-radius:8px;
}

/* =========================
   الإغلاق
========================= */

.closure-info{
    margin-top:9px;
    background:#fff7ed;
    color:#9a3412;
    border-radius:9px;
    padding:8px 9px;
    font-size:12px;
    font-weight:750;
    line-height:1.7;
}

/* =========================
   التقييم - مختصر
========================= */

.rating-box{
    margin-top:10px;
    padding-top:9px;
    border-top:1px solid #eef2f2;
}

.rating-summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.rating-average{
    font-size:12px;
    font-weight:800;
    color:#555;
}

.rating-toggle{
    border:0;
    background:#f8fafc;
    color:#0f766e;
    border-radius:8px;
    padding:6px 8px;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
}

.rating-content{
    margin-top:8px;
}

.rating-help{
    font-size:11px;
    color:#0f766e;
    font-weight:700;
    margin-top:4px;
}

/* النجوم صغيرة */

.stars{
    margin-top:6px;
    display:flex;
    gap:2px;
    direction:ltr;
    justify-content:flex-start;
    align-items:flex-start;
}

.star-item{
    text-align:center;
    min-width:31px;
}

.star{
    border:0;
    background:transparent;
    font-size:21px;
    padding:1px;
    cursor:pointer;
    line-height:1;
    transition:.15s;
}

.star:hover{
    transform:scale(1.08);
}

.star.selected{
    transform:scale(1.08);
}

.star-number{
    font-size:10px;
    font-weight:800;
    color:#555;
    margin-top:1px;
}

.rating-selected{
    font-size:11px;
    font-weight:700;
    color:#0f766e;
    margin-top:5px;
    min-height:17px;
}

.confirm-rating{
    margin-top:6px;
    border:0;
    background:#0f766e;
    color:#fff;
    border-radius:8px;
    padding:7px 11px;
    font:inherit;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
}

.rating-message{
    font-size:11px;
    color:#0f766e;
    margin-top:5px;
    min-height:15px;
}

/* =========================
   الوقت
========================= */

.time{
    font-size:10px;
    color:#777;
    margin-top:8px;
    text-align:left;
}

/* =========================
   الهاتف
========================= */

@media(max-width:600px){

    header{
        padding:17px 12px 15px;
    }

    .brand{
        font-size:25px;
    }

    .admin-message{
        font-size:10px;
        padding:5px 8px;
    }

    .sub{
        font-size:13px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:8px;
    }

    .card{
        padding:12px;
        border-radius:14px;
    }

    .name{
        font-size:18px;
    }

    .main-info{
        gap:5px;
    }

    .info-badge{
        padding:7px 8px;
        font-size:11px;
    }

    .stats{
        gap:5px;
    }

    .stat{
        padding:7px 3px;
    }

    .stat b{
        font-size:18px;
    }

    .stat span{
        font-size:10px;
    }

}

/* =========================
   شاشات صغيرة جداً
========================= */

@media(max-width:380px){

    .brand{
        font-size:22px;
    }

    .admin-message{
        font-size:9px;
    }

    .info-badge{
        font-size:10px;
        padding:6px 7px;
    }

    .name{
        font-size:17px;
    }

}

</style>

</head>


<body>


<header>

<div class="wrap">

<div class="header-top">

<div class="brand">
⛽ كازيات حلب
</div>

<a
class="admin-message"
href="https://wa.me/905050978000?text=مرحباً،%20لدي%20معلومات%20أو%20تحديث%20بخصوص%20كازيات%20حلب"
target="_blank"
rel="noopener">

📩 المشرف

</a>

</div>


<div class="sub">
حالة المحطات وآخر تحديثات الوقود
</div>


<div class="credit">
By Ammar Morgan
</div>


<div
class="updated-line"
id="updatedLine">

آخر تحديث: جاري التحميل…

</div>


<div class="search">

<input
id="search"
type="search"
placeholder="ابحث عن محطة أو منطقة…"
autocomplete="off">

</div>


</div>

</header>


<main class="wrap">


<!-- =========================
     الإحصائيات
========================= -->

<div
class="stats"
id="stats">
</div>


<!-- =========================
     اختيار المنطقة
========================= -->

<div class="filters">


<button
class="active"
data-region="city">

🏙️ حلب المدينة

</button>


<button
data-region="countryside">

🏡 ريف حلب

</button>


</div>


<!-- =========================
     فلاتر المحطات
========================= -->

<div class="filters">


<button
class="active"
data-f="all">

الكل

</button>


<button data-f="open">
تعمل
</button>


<button data-f="both">
بنزين + مازوت
</button>


<button data-f="gas">
بنزين
</button>


<button data-f="diesel">
مازوت
</button>


<button data-f="closed">
مغلقة
</button>


<button data-f="none">
لا يوجد ازدحام
</button>


<button data-f="long">
طابور طويل
</button>


<button data-f="light">
ازدحام خفيف
</button>


</div>


<div
class="count-row"
id="count">
</div>


<section
class="grid"
id="stations">
</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   Supabase
========================= */

const sb=supabase.createClient(

"https://hjggfolotblsurfwfcvn.supabase.co",

"sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl"

);


/* =========================
   المتغيرات
========================= */

let all=[];

let filter="all";

let regionFilter="city";

const ratings={};

const selectedRatings={};

const $=id=>document.getElementById(id);


/* =========================
   حماية النصوص
========================= */

function esc(x){

return String(x??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m]));

}


/* =========================
   التاريخ
========================= */

function fmt(t){

if(!t)
return "—";

return new Intl.DateTimeFormat(
"ar-SY",
{
day:"numeric",
month:"numeric",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
).format(new Date(t));

}


/* =========================
   سبب الإغلاق
========================= */

function closureReasonText(v){

const value=
String(v??"")
.trim()
.toLowerCase();


if(value==="maintenance")
return "🔧 صيانة";


if(value==="technical")
return "⚡ عطل فني";


if(value==="delivery")
return "🚚 بانتظار وصول الطلبية";


if(value==="fuel")
return "⛽ نفاد الوقود";


if(value==="administrative")
return "🏢 إغلاق إداري";


if(value==="temporary")
return "🕐 إغلاق مؤقت";


return "";

}


/* =========================
   الازدحام
========================= */

function tr(v){

const value=
String(v??"")
.trim()
.toLowerCase();


if(value==="none")
return [
"🟢",
"لا يوجد ازدحام",
"ok"
];


if(value==="light")
return [
"🟡",
"ازدحام خفيف",
"warn"
];


if(value==="long")
return [
"🔴",
"طابور طويل",
"no"
];


return [
"❌",
"مغلقة",
"gray"
];

}


/* =========================
   زر الموقع
========================= */

function locationButton(s){

if(!s.location_url)
return "";


return `

<a
class="location-link"
href="${esc(s.location_url)}"
target="_blank"
rel="noopener">

📍 الموقع

</a>

`;

}


/* =========================
   زر الشكوى
========================= */

function complaintButton(s){

const stationName=
String(s.name??"محطة");


const text=
`شكوى بخصوص ${stationName}

أرغب بتقديم شكوى:`;


const url=
"https://wa.me/905050978000?text="+
encodeURIComponent(text);


return `

<a
class="complaint-link"
href="${url}"
target="_blank"
rel="noopener">

📩 شكوى

</a>

`;

}


/* =========================
   صندوق التقييم
========================= */

function ratingBox(s){

const r=
ratings[s.id] ||
{
average:0,
count:0
};


const average=
Number(r.average||0).toFixed(1);


const count=
Number(r.count||0);


return `

<div class="rating-box">

<div class="rating-summary">

<div class="rating-average">

⭐ ${average} / 5
${count ? ` • ${count} تقييم` : " • لا يوجد تقييم"}

</div>


<button
class="rating-toggle"
type="button"
onclick="toggleRating(${Number(s.id)})">

⭐ تقييم المحطة

</button>

</div>


<div
class="rating-content"
id="rating-content-${Number(s.id)}"
style="display:none">


<div class="stars">

${[1,2,3,4,5].map(n=>`

<div class="star-item">

<button
class="star"
onclick="selectRating(${Number(s.id)},${n})"
id="star-${Number(s.id)}-${n}"
title="تقييم ${n} من 5">

☆

</button>


<div class="star-number">
${n}
</div>

</div>

`).join("")}

</div>


<div
class="rating-selected"
id="rating-selected-${Number(s.id)}">

اختر تقييمك من 1 إلى 5

</div>


<button
class="confirm-rating"
id="confirm-rating-${Number(s.id)}"
onclick="confirmRating(${Number(s.id)})"
style="display:none">

✅ تأكيد

</button>


<div
class="rating-message"
id="rating-message-${Number(s.id)}">
</div>


</div>

</div>

`;

}


/* =========================
   فتح التقييم
========================= */

function toggleRating(stationId){

const box=
document.getElementById(
"rating-content-"+stationId
);

if(!box)
return;


if(box.style.display==="none"){

box.style.display="block";

}else{

box.style.display="none";

}

}


/* =========================
   اختيار التقييم
========================= */

function selectRating(stationId,rating){

selectedRatings[stationId]=rating;


const selected=
document.getElementById(
"rating-selected-"+stationId
);


if(selected){

selected.textContent=
"اخترت ⭐ "+rating+
" من 5";

}


/* تحديث النجوم */

for(let n=1;n<=5;n++){

const star=
document.getElementById(
"star-"+stationId+"-"+n
);


if(star){

star.textContent=
n<=rating
?
"⭐"
:
"☆";


if(n<=rating){

star.classList.add("selected");

}else{

star.classList.remove("selected");

}

}

}


/* إظهار زر التأكيد */

const confirm=
document.getElementById(
"confirm-rating-"+stationId
);


if(confirm){

confirm.style.display=
"inline-block";

}

}


/* =========================
   تأكيد التقييم
========================= */

async function confirmRating(stationId){

const rating=
selectedRatings[stationId];


if(!rating){

return;

}


const message=
document.getElementById(
"rating-message-"+stationId
);


if(message){

message.textContent=
"جاري إرسال التقييم…";

}


const storageKey=
"rated_station_"+stationId;


/* منع التقييم الثاني */

if(localStorage.getItem(storageKey)){

if(message){

message.textContent=
"⚠️ لقد قيّمت هذه المحطة مسبقًا من هذا الجهاز.";

}

return;

}


/* إرسال التقييم */

const {error}=
await sb
.from("station_ratings")
.insert({

station_id:Number(stationId),

rating:Number(rating)

});


if(error){

console.error(error);


if(message){

message.textContent=
"تعذر إرسال التقييم، حاول مرة أخرى.";

}

return;

}


/* حفظ حالة التقييم */

localStorage.setItem(
storageKey,
"1"
);


/* رسالة النجاح */

if(message){

message.textContent=
"✅ تم تسجيل تقييمك.";

}


delete selectedRatings[stationId];


await loadRatings();


await render();

}


/* =========================
   فلتر المحطة
========================= */

function stationMatchesFilter(s){

const status=
String(s.status??"")
.trim()
.toLowerCase();


const gas=
String(s.gas??"")
.trim()
.toLowerCase();


const diesel=
String(s.diesel??"")
.trim()
.toLowerCase();


const traffic=
String(s.traffic??"")
.trim()
.toLowerCase();


const region=
String(s.region??"")
.trim()
.toLowerCase();


/* =========================
   المنطقة
========================= */

if(regionFilter==="countryside"){

if(region!=="countryside")
return false;

}else{

/*
أي محطة ليست ريف حلب
تعتبر من مدينة حلب
*/

if(region==="countryside")
return false;

}


/* =========================
   الحالة
========================= */

if(filter==="open"){

return status==="open";

}


if(filter==="closed"){

return status==="closed";

}


if(filter==="both"){

return (
status==="open" &&
gas==="yes" &&
diesel==="yes"
);

}


if(filter==="gas"){

return (
status==="open" &&
gas==="yes"
);

}


if(filter==="diesel"){

return (
status==="open" &&
diesel==="yes"
);

}


/* لا يوجد ازدحام */

if(filter==="none"){

return (
status==="open" &&
traffic==="none"
);

}


if(filter==="long"){

return (
status==="open" &&
traffic==="long"
);

}


if(filter==="light"){

return (
status==="open" &&
traffic==="light"
);

}


return true;

}


/* =========================
   تحميل التقييمات
========================= */

async function loadRatings(){

const {data,error}=
await sb
.from("station_ratings")
.select("station_id,rating");


if(error){

console.log(
"Ratings error:",
error.message
);

return;

}


Object.keys(ratings)
.forEach(
k=>
delete ratings[k]
);


(data||[]).forEach(row=>{

const id=
String(row.station_id);


if(!ratings[id]){

ratings[id]={
total:0,
count:0,
average:0
};

}


ratings[id].total +=
Number(row.rating);


ratings[id].count +=
1;


ratings[id].average=
ratings[id].total /
ratings[id].count;

});

}


/* =========================
   عرض المحطات
========================= */

async function render(){

const q=
$("search")
.value
.trim()
.toLowerCase();


const a=
all.filter(s=>{

const name=
String(s.name??"")
.toLowerCase();


const area=
String(s.area??"")
.toLowerCase();


if(
q &&
!((name+" "+area).includes(q))
){

return false;

}


return stationMatchesFilter(s);

});


/* =========================
   الإحصائيات
========================= */

const total=
a.length;


const open=
a.filter(
s=>
String(s.status??"")
.trim()
.toLowerCase()==="open"
).length;


const closed=
a.filter(
s=>
String(s.status??"")
.trim()
.toLowerCase()==="closed"
).length;


const gas=
a.filter(
s=>
String(s.status??"")

.from("stations")
.select("*")
.order(

{

}
);

$("stations").innerHTML=

`

${esc(error.message)}

}


all=data||[];


if(all.length){

const latest=
all.reduce(

(a,b)=>

new Date(a.updated_at) >
new Date(b.updated_at)

a

b

);

.textContent=

fmt(latest.updated_at);

}
