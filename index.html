<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">

<title>كازيات حلب</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:#f3f6f6;
    color:#17202a;
}

.wrap{
    width:min(900px,calc(100% - 20px));
    margin:auto;
}

/* =========================
   الهيدر
========================= */

header{
    background:#0f766e;
    color:#fff;
    padding:16px 0 15px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.brand{
    font-size:26px;
    font-weight:900;
}

.admin-message{
    display:inline-block;
    color:#fff;
    border:1px solid rgba(255,255,255,.65);
    border-radius:999px;
    padding:6px 10px;
    font-size:11px;
    font-weight:700;
    text-decoration:none;
    white-space:nowrap;
}

.sub{
    margin-top:4px;
    opacity:.9;
    font-size:14px;
}

.credit{
    margin-top:5px;
    font-size:11px;
    opacity:.7;
}

.updated-line{
    margin-top:6px;
    font-size:11px;
    opacity:.9;
}

.search{
    margin-top:12px;
}

.search input{
    width:100%;
    padding:13px 15px;
    border:0;
    border-radius:14px;
    font-size:15px;
    outline:none;
}

/* =========================
   الفلاتر
========================= */

.filters-wrap{
    overflow:hidden;
}

.filters{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:10px 0;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filters button{
    white-space:nowrap;
    border:1px solid #d6dddd;
    background:#fff;
    border-radius:999px;
    padding:8px 13px;
    cursor:pointer;
    font:inherit;
    font-size:12px;
    color:#17202a;
    flex-shrink:0;
}

.filters button.active{
    background:#0f766e;
    color:#fff;
    border-color:#0f766e;
}

/* =========================
   الإحصائيات
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin:8px 0;
}

.stat{
    background:#fff;
    border:1px solid #e1e7e7;
    border-radius:11px;
    padding:7px 4px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:18px;
    line-height:1.2;
}

.stat span{
    display:block;
    margin-top:2px;
    font-size:10px;
    color:#69757a;
}

.count-row{
    margin:3px 2px 8px;
    font-size:11px;
    color:#68757a;
}

/* =========================
   شبكة المحطات
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
}

/* =========================
   بطاقة المحطة
========================= */

.station-card{
    background:#fff;
    border-radius:14px;
    border:2px solid #dce5e4;
    overflow:hidden;
    cursor:pointer;
    transition:.15s;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
    min-width:0;
}

.station-card.open{
    border-color:#86efac;
}

.station-card.closed{
    border-color:#fca5a5;
}

/* =========================
   الجزء الرئيسي
========================= */

.station-main{
    padding:10px;
}

.station-head{
    display:flex;
    align-items:flex-start;
    gap:7px;
}

.status-circle{
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
    margin-top:6px;
}

.status-circle.green{
    background:#22c55e;
}

.status-circle.red{
    background:#ef4444;
}

.station-name{
    font-size:15px;
    font-weight:900;
    line-height:1.3;
}

.station-area{
    color:#68757a;
    font-size:9px;
    margin-top:2px;
    padding-right:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   الوقود
========================= */

.fuel-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-top:9px;
}

.fuel-item{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    background:#f8fafb;
    border-radius:8px;
    padding:7px 3px;
    font-size:10px;
    font-weight:800;
}

.fuel-dot{
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
}

.fuel-dot.yes{
    background:#22c55e;
}

.fuel-dot.no{
    background:#ef4444;
}

/* =========================
   المغلقة
========================= */

.closed-status{
    margin-top:9px;
    background:#f1f5f9;
    color:#64748b;
    border-radius:8px;
    padding:7px 5px;
    text-align:center;
    font-size:10px;
    font-weight:800;
}

/* =========================
   التفاصيل
========================= */

.station-details{
    display:none;
    border-top:1px solid #e5eaea;
    background:#fafcfc;
    padding:10px;
}

.station-card.expanded .station-details{
    display:block;
}

/* =========================
   أزرار التفاصيل
========================= */

.detail-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.detail-button{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    border:0;
    border-radius:8px;
    padding:7px 3px;
    font:inherit;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}

.location-button{
    background:#ecfdf5;
    color:#047857;
    border:1px solid #a7f3d0;
}

.message-button{
    background:#eff6ff;
    color:#1d4ed8;
    border:1px solid #bfdbfe;
}

.rating-button{
    background:#fff7ed;
    color:#c2410c;
    border:1px solid #fed7aa;
}

/* =========================
   الازدحام
========================= */

.traffic-box{
    margin-top:7px;
    padding:7px 8px;
    border-radius:8px;
    font-size:10px;
    font-weight:800;
    text-align:center;
}

.traffic-none{
    background:#dcfce7;
    color:#166534;
}

.traffic-light{
    background:#fef3c7;
    color:#92400e;
}

.traffic-long{
    background:#fee2e2;
    color:#991b1b;
}

/* =========================
   الإغلاق
========================= */

.closure-box{
    margin-top:7px;
    background:#fff7ed;
    color:#9a3412;
    border-radius:8px;
    padding:7px 8px;
    font-size:10px;
    line-height:1.6;
    font-weight:700;
}

/* =========================
   الملاحظة
========================= */

.note-box{
    margin-top:7px;
    background:#f1f5f9;
    color:#475569;
    border-radius:8px;
    padding:7px 8px;
    font-size:10px;
    line-height:1.6;
}

/* =========================
   التقييم
========================= */

.rating-section{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid #e5eaea;
}

.rating-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
}

.rating-average{
    font-size:10px;
    color:#555;
    font-weight:800;
}

.rating-toggle{
    border:0;
    background:#fff;
    color:#0f766e;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
    padding:4px 6px;
    border-radius:7px;
}

.rating-content{
    display:none;
    margin-top:7px;
}

.rating-content.show{
    display:block;
}

.stars{
    display:flex;
    direction:ltr;
    justify-content:center;
    gap:1px;
}

.star{
    border:0;
    background:transparent;
    font-size:21px;
    line-height:1;
    padding:2px;
    cursor:pointer;
}

.rating-selected{
    text-align:center;
    font-size:9px;
    color:#0f766e;
    font-weight:700;
    min-height:14px;
    margin-top:4px;
}

.confirm-rating{
    display:none;
    border:0;
    background:#0f766e;
    color:#fff;
    border-radius:7px;
    padding:6px 10px;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
    margin:5px auto 0;
}

.rating-message{
    text-align:center;
    color:#0f766e;
    font-size:9px;
    min-height:14px;
    margin-top:4px;
}

/* =========================
   آخر تحديث
========================= */

.station-time{
    margin-top:7px;
    text-align:left;
    color:#888;
    font-size:8px;
}

/* =========================
   التحميل والخطأ
========================= */

.loading{
    background:#fff;
    border:1px solid #e1e7e7;
    border-radius:14px;
    padding:30px 15px;
    text-align:center;
    color:#777;
    font-size:14px;
}

.error-box{
    background:#fff;
    border:2px solid #fca5a5;
    border-radius:14px;
    padding:22px 15px;
    text-align:center;
    color:#991b1b;
    font-size:13px;
    line-height:1.7;
}

.retry-button{
    margin-top:12px;
    border:0;
    background:#0f766e;
    color:#fff;
    border-radius:9px;
    padding:9px 18px;
    font-weight:800;
    cursor:pointer;
}

/* =========================
   الهاتف
========================= */

@media(max-width:600px){

    .wrap{
        width:calc(100% - 18px);
    }

    header{
        padding:15px 0 13px;
    }

    .brand{
        font-size:22px;
    }

    .admin-message{
        font-size:9px;
        padding:5px 8px;
    }

    .sub{
        font-size:12px;
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
    }

    .station-main{
        padding:9px;
    }

    .station-name{
        font-size:14px;
    }

    .station-area{
        font-size:8px;
    }

    .fuel-item{
        padding:6px 2px;
        font-size:9px;
    }

    .detail-actions{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:360px){

    .brand{
        font-size:20px;
    }

    .station-name{
        font-size:13px;
    }

    .fuel-item{
        font-size:8px;
    }

}

</style>
</head>
