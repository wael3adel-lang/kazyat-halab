<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">

<title>كازيات حلب</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:#f3f6f6;
    color:#17202a;
}

.wrap{
    width:min(900px,calc(100% - 18px));
    margin:auto;
}

/* =========================
   الهيدر
========================= */

header{
    background:#0f766e;
    color:#fff;
    padding:16px 0 15px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.brand{
    font-size:26px;
    font-weight:900;
}

.admin-message{
    display:inline-block;
    color:#fff;
    border:1px solid rgba(255,255,255,.65);
    border-radius:999px;
    padding:6px 10px;
    font-size:11px;
    font-weight:700;
    text-decoration:none;
    white-space:nowrap;
}

.sub{
    margin-top:4px;
    opacity:.9;
    font-size:14px;
}

.credit{
    margin-top:5px;
    font-size:11px;
    opacity:.7;
}

.updated-line{
    margin-top:6px;
    font-size:11px;
    opacity:.9;
}

.search{
    margin-top:12px;
}

.search input{
    width:100%;
    padding:13px 15px;
    border:0;
    border-radius:14px;
    font-size:15px;
    outline:none;
}

/* =========================
   الفلاتر
========================= */

.filters-wrap{
    overflow:hidden;
}

.filters{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:10px 0;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filters button{
    white-space:nowrap;
    border:1px solid #d6dddd;
    background:#fff;
    border-radius:999px;
    padding:8px 13px;
    cursor:pointer;
    font:inherit;
    font-size:12px;
    color:#17202a;
    flex-shrink:0;
}

.filters button.active{
    background:#0f766e;
    color:#fff;
    border-color:#0f766e;
}

/* =========================
   الإحصائيات
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin:8px 0;
}

.stat{
    background:#fff;
    border:1px solid #e1e7e7;
    border-radius:11px;
    padding:7px 4px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:18px;
    line-height:1.2;
}

.stat span{
    display:block;
    margin-top:2px;
    font-size:10px;
    color:#69757a;
}

.count-row{
    margin:3px 2px 8px;
    font-size:11px;
    color:#68757a;
}

/* =========================
   شبكة المحطات
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
}

/* =========================
   بطاقة المحطة
========================= */

.station-card{
    background:#fff;
    border-radius:14px;
    border:2px solid #dce5e4;
    overflow:hidden;
    cursor:pointer;
    transition:.15s;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
    min-width:0;
}

.station-card.open{
    border-color:#22c55e;
}

.station-card.closed{
    border-color:#ef4444;
}

/* =========================
   الجزء الظاهر
========================= */

.station-main{
    padding:10px;
}

.station-head{
    display:flex;
    align-items:flex-start;
    gap:7px;
}

.status-circle{
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
    margin-top:6px;
}

.status-circle.green{
    background:#22c55e;
}

.status-circle.red{
    background:#ef4444;
}

.station-name{
    font-size:15px;
    font-weight:900;
    line-height:1.3;
}

.station-area{
    color:#68757a;
    font-size:9px;
    margin-top:2px;
    padding-right:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   الوقود
========================= */

.fuel-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-top:9px;
}

.fuel-item{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    background:#f8fafb;
    border-radius:8px;
    padding:7px 3px;
    font-size:10px;
    font-weight:800;
}

.fuel-dot{
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
}

.fuel-dot.yes{
    background:#22c55e;
}

.fuel-dot.no{
    background:#ef4444;
}

/* =========================
   المحطة المغلقة
========================= */

.closed-status{
    margin-top:9px;
    background:#f1f5f9;
    color:#64748b;
    border-radius:8px;
    padding:7px 5px;
    text-align:center;
    font-size:10px;
    font-weight:800;
}

.closed-status strong{
    color:#dc2626;
}

/* =========================
   التفاصيل
========================= */

.station-details{
    display:none;
    border-top:1px solid #e5eaea;
    background:#fafcfc;
    padding:10px;
}

.station-card.expanded .station-details{
    display:block;
}

/* =========================
   أزرار التفاصيل
========================= */

.detail-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.detail-button{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    border:0;
    border-radius:8px;
    padding:7px 3px;
    font:inherit;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}

.location-button{
    background:#ecfdf5;
    color:#047857;
    border:1px solid #a7f3d0;
}

.message-button{
    background:#eff6ff;
    color:#1d4ed8;
    border:1px solid #bfdbfe;
}

.rating-button{
    background:#fff7ed;
    color:#c2410c;
    border:1px solid #fed7aa;
}

/* =========================
   الازدحام
========================= */

.traffic-box{
    margin-top:7px;
    padding:7px 8px;
    border-radius:8px;
    font-size:10px;
    font-weight:800;
    text-align:center;
}

.traffic-none{
    background:#dcfce7;
    color:#166534;
}

.traffic-light{
    background:#fef3c7;
    color:#92400e;
}

.traffic-long{
    background:#fee2e2;
    color:#991b1b;
}

/* =========================
   الإغلاق
========================= */

.closure-box{
    margin-top:7px;
    background:#fff7ed;
    color:#9a3412;
    border-radius:8px;
    padding:7px 8px;
    font-size:10px;
    line-height:1.6;
    font-weight:700;
}

/* =========================
   الملاحظة
========================= */

.note-box{
    margin-top:7px;
    background:#f1f5f9;
    color:#475569;
    border-radius:8px;
    padding:7px 8px;
    font-size:10px;
    line-height:1.6;
}

/* =========================
   التقييم
========================= */

.rating-section{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid #e5eaea;
}

.rating-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
}

.rating-average{
    font-size:10px;
    color:#555;
    font-weight:800;
}

.rating-toggle{
    border:0;
    background:#fff;
    color:#0f766e;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
    padding:4px 6px;
    border-radius:7px;
}

.rating-content{
    display:none;
    margin-top:7px;
}

.rating-content.show{
    display:block;
}

.stars{
    display:flex;
    direction:ltr;
    justify-content:center;
    gap:1px;
}

.star{
    border:0;
    background:transparent;
    font-size:21px;
    line-height:1;
    padding:2px;
    cursor:pointer;
}

.rating-selected{
    text-align:center;
    font-size:9px;
    color:#0f766e;
    font-weight:700;
    min-height:14px;
    margin-top:4px;
}

.confirm-rating{
    display:none;
    border:0;
    background:#0f766e;
    color:#fff;
    border-radius:7px;
    padding:6px 10px;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
    margin:5px auto 0;
}

.rating-message{
    text-align:center;
    color:#0f766e;
    font-size:9px;
    min-height:14px;
    margin-top:4px;
}

/* =========================
   آخر تحديث
========================= */

.station-time{
    margin-top:7px;
    text-align:left;
    color:#888;
    font-size:8px;
}

/* =========================
   التحميل
========================= */

.loading{
    background:#fff;
    border:1px solid #e1e7e7;
    border-radius:14px;
    padding:30px 15px;
    text-align:center;
    color:#777;
    font-size:14px;
}

/* =========================
   الخطأ
========================= */

.error-box{
    background:#fff;
    border:2px solid #fca5a5;
    border-radius:14px;
    padding:22px 15px;
    text-align:center;
    color:#991b1b;
    font-size:13px;
    line-height:1.7;
}

.retry-button{
    margin-top:12px;
    border:0;
    background:#0f766e;
    color:#fff;
    border-radius:9px;
    padding:9px 18px;
    font-weight:800;
    cursor:pointer;
}

/* =========================
   الهاتف
========================= */

@media(max-width:600px){

    .wrap{
        width:calc(100% - 18px);
    }

    header{
        padding:15px 0 13px;
    }

    .brand{
        font-size:22px;
    }

    .admin-message{
        font-size:9px;
        padding:5px 8px;
    }

    .sub{
        font-size:12px;
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
    }

    .station-main{
        padding:9px;
    }

    .station-name{
        font-size:14px;
    }

    .station-area{
        font-size:8px;
    }

    .fuel-item{
        padding:6px 2px;
        font-size:9px;
    }

}

@media(max-width:360px){

    .brand{
        font-size:20px;
    }

    .station-name{
        font-size:13px;
    }

    .fuel-item{
        font-size:8px;
    }

}

</style>
</head>

target="_blank"

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://hjggfolotblsurfwfcvn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl";

const sb =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   المتغيرات
========================= */

let all = [];

let filter = "all";

let regionFilter = "city";

const ratings = {};

const selectedRatings = {};

let loadingNow = false;


/* =========================
   اختصار
========================= */

const $ = id =>
document.getElementById(id);


/* =========================
   حماية النصوص
========================= */

function esc(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(m){

return {
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
}[m];

});

}


/* =========================
   التاريخ
========================= */

function fmt(value){

if(!value)
return "—";

const d = new Date(value);

if(isNaN(d.getTime()))
return "—";

return new Intl.DateTimeFormat(
"ar-SY",
{
    day:"numeric",
    month:"numeric",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
}
).format(d);

}


/* =========================
   سبب الإغلاق
========================= */

function closureReasonText(value){

const v =
String(value ?? "")
.trim()
.toLowerCase();

if(v === "maintenance")
return "🔧 صيانة";

if(v === "technical")
return "⚡ عطل فني";

if(v === "delivery")
return "🚚 بانتظار وصول الطلبية";

if(v === "fuel")
return "⛽ نفاد الوقود";

if(v === "administrative")
return "🏢 إغلاق إداري";

if(v === "temporary")
return "🕐 إغلاق مؤقت";

if(v === "security")
return "🔒 أسباب أمنية";

return value
? String(value)
: "";

}


/* =========================
   الازدحام
========================= */

function trafficInfo(value){

const v =
String(value ?? "")
.trim()
.toLowerCase();

if(v === "none"){

return {
    text:"🟢 لا يوجد ازدحام",
    className:"traffic-none"
};

}

if(v === "light"){

return {
    text:"🟡 ازدحام خفيف",
    className:"traffic-light"
};

}

if(v === "long"){

return {
    text:"🔴 طابور طويل",
    className:"traffic-long"
};

}

return null;

}


/* =========================
   المنطقة
========================= */

function getRegion(s){

const value =
String(
    s.region_type ??
    s.region ??
    ""
)
.trim()
.toLowerCase();

if(value === "countryside")
return "countryside";

return "city";

}


/* =========================
   فتح البطاقة
========================= */

function toggleStation(id){

const card =
document.getElementById(
    "station-" + String(id)
);

if(!card)
return;

card.classList.toggle("expanded");

}


/* =========================
   الموقع
========================= */

function locationButton(s){

if(!s.location_url)
return "";

return `
<a
class="detail-button location-button"
href="${esc(s.location_url)}"
target="_blank"
rel="noopener"
onclick="event.stopPropagation()">

📍 الموقع

</a>
`;

}


/* =========================
   الرسالة
========================= */

function messageButton(s){

const stationName =
String(s.name || "محطة");

const text =
"مرحباً، لدي رسالة بخصوص " +
stationName +
"\n\nالرسالة:";

const url =
"https://wa.me/905050978000?text=" +
encodeURIComponent(text);

return `
<a
class="detail-button message-button"
href="${url}"
target="_blank"
rel="noopener"
onclick="event.stopPropagation()">

📩 رسالة

</a>
`;

}


/* =========================
   التقييم
========================= */

function ratingBox(s){

const id =
String(s.id);

const r =
ratings[id] ||
{
    average:0,
    count:0
};

const average =
Number(r.average || 0).toFixed(1);

const count =
Number(r.count || 0);

return `

<div
class="rating-section"
onclick="event.stopPropagation()">

<div class="rating-top">

<div class="rating-average">

⭐ ${average} / 5
${count
? " • " + count + " تقييم"
: " • لا يوجد تقييم"}

</div>

<button
class="rating-toggle"
type="button"
onclick="toggleRating('${esc(id)}')">

⭐ تقييم المحطة

</button>

</div>


<div
class="rating-content"
id="rating-content-${esc(id)}">

<div class="stars">

${[1,2,3,4,5].map(function(n){

return `

<button
class="star"
type="button"
onclick="selectRating('${esc(id)}',${n})"
id="star-${esc(id)}-${n}">

☆

</button>

`;

}).join("")}

</div>


<div
class="rating-selected"
id="rating-selected-${esc(id)}">

اختر تقييمك من 1 إلى 5

</div>


<button
class="confirm-rating"
id="confirm-rating-${esc(id)}"
type="button"
onclick="confirmRating('${esc(id)}')">

✅ تأكيد التقييم

</button>


<div
class="rating-message"
id="rating-message-${esc(id)}">
</div>

</div>

</div>

`;

}


/* =========================
   فتح التقييم
========================= */

function toggleRating(id){

const box =
document.getElementById(
    "rating-content-" + id
);

if(!box)
return;

box.classList.toggle("show");

}


/* =========================
   اختيار التقييم
========================= */

function selectRating(id,rating){

selectedRatings[id] =
rating;

const selected =
document.getElementById(
    "rating-selected-" + id
);

if(selected){

selected.textContent =
"اخترت ⭐ " +
rating +
" من 5";

}

for(let n=1;n<=5;n++){

const star =
document.getElementById(
    "star-" + id + "-" + n
);

if(star){

star.textContent =
n <= rating
? "⭐"
: "☆";

}

}

const confirm =
document.getElementById(
    "confirm-rating-" + id
);

if(confirm){

confirm.style.display =
"block";

}

}


/* =========================
   إرسال التقييم
========================= */

async function confirmRating(id){

const rating =
selectedRatings[id];

if(!rating)
return;

const message =
document.getElementById(
    "rating-message-" + id
);

if(message){

message.textContent =
"جاري إرسال التقييم...";

}

const storageKey =
"rated_station_" + id;

if(localStorage.getItem(storageKey)){

if(message){

message.textContent =
"⚠️ لقد قيّمت هذه المحطة مسبقاً من هذا الجهاز.";

}

return;

}

try{

const result =
await sb
.from("station_ratings")
.insert({
    station_id:id,
    rating:Number(rating)
});

if(result.error){

console.error(
result.error
);

if(message){

message.textContent =
"تعذر إرسال التقييم.";

}

return;

}

localStorage.setItem(
storageKey,
"1"
);

if(message){

message.textContent =
"✅ تم تسجيل تقييمك.";

}

delete selectedRatings[id];

await loadRatings();

render();

}catch(error){

console.error(error);

if(message){

message.textContent =
"تعذر إرسال التقييم.";

}

}

}


/* =========================
   مطابقة الفلاتر
========================= */

function stationMatchesFilter(s){

const status =
String(s.status ?? "")
.trim()
.toLowerCase();

const gas =
String(s.gas ?? "")
.trim()
.toLowerCase();

const diesel =
String(s.diesel ?? "")
.trim()
.toLowerCase();

const traffic =
String(s.traffic ?? "")
.trim()
.toLowerCase();

const region =
getRegion(s);


/* المنطقة */

if(regionFilter === "countryside"){

if(region !== "countryside")
return false;

}else{

if(region === "countryside")
return false;

}


/* الفلاتر */

if(filter === "open")
return status === "open";

if(filter === "closed")
return status === "closed";

if(filter === "both"){

return (
status === "open" &&
gas === "yes" &&
diesel === "yes"
);

}

if(filter === "gas"){

return (
status === "open" &&
gas === "yes"
);

}

if(filter === "diesel"){

return (
status === "open" &&
diesel === "yes"
);

}

if(filter === "none"){

return (
status === "open" &&
traffic === "none"
);

}

if(filter === "long"){

return (
status === "open" &&
traffic === "long"
);

}

if(filter === "light"){

return (
status === "open" &&
traffic === "light"
);

}

return true;

}


/* =========================
   تحميل التقييمات
========================= */

async function loadRatings(){

try{

const result =
await sb
.from("station_ratings")
.select("station_id,rating");

if(result.error){

console.log(
"Ratings error:",
result.error.message
);

return;

}

Object.keys(ratings)
.forEach(function(k){

delete ratings[k];

});


(result.data || [])
.forEach(function(row){

const id =
String(row.station_id);

if(!ratings[id]){

ratings[id] = {
    total:0,
    count:0,
    average:0
};

}

ratings[id].total +=
Number(row.rating) || 0;

ratings[id].count += 1;

ratings[id].average =
ratings[id].total /
ratings[id].count;

});

}catch(error){

console.log(
"Ratings failed:",
error
);

}

}

/* =========================
   تحميل البيانات مع مهلة
========================= */

async function load(){

if(loadingNow)
return;

loadingNow = true;

$("updatedLine").textContent =
"آخر تحديث: جاري التحميل…";

$("stations").innerHTML = `

<div class="loading">

جاري تحميل المحطات...

</div>

`;

try{


/*
   نضع مهلة 10 ثواني.
   إذا Supabase لم يستجب،
   لا تبقى الصفحة معلقة.
*/

const query =
sb
.from("stations")
.select("*")
.order(
"updated_at",
{
    ascending:false
}
);


const timeout =
new Promise(function(_,reject){

setTimeout(function(){

reject(
new Error(
"انتهت مهلة الاتصال بقاعدة البيانات."
)
);

},10000);

});


const result =
await Promise.race([
    query,
    timeout
]);


if(result.error){

throw result.error;

}


all =
result.data || [];


/* آخر تحديث */

if(all.length){

const valid =
all.filter(function(s){

return s.updated_at;

});


if(valid.length){

const latest =
valid.reduce(function(a,b){

return new Date(a.updated_at) >
new Date(b.updated_at)
? a
: b;

});


$("updatedLine").textContent =
"آخر تحديث: " +
fmt(latest.updated_at);

}else{

$("updatedLine").textContent =
"آخر تحديث: —";

}

}else{

$("updatedLine").textContent =
"آخر تحديث: —";

}


/*
   نرسم المحطات أولاً.
   التقييمات لا تمنع ظهور المحطات.
*/

render();


/*
   التقييمات بشكل منفصل.
*/

loadRatings()
.then(function(){

render();

})
.catch(function(error){

console.log(
"Ratings load error:",
error
);

});


}catch(error){

console.error(
"LOAD ERROR:",
error
);

$("updatedLine").textContent =
"تعذر تحميل البيانات";


$("stations").innerHTML = `

<div class="error-box">

❌ تعذر تحميل المحطات

<br><br>

تأكد من اتصال الإنترنت ثم اضغط إعادة المحاولة.

<br>

<small>
${esc(error.message || "")}
</small>

<br>

<button
class="retry-button"
onclick="load()">

🔄 إعادة المحاولة

</button>

</div>

`;

}finally{

loadingNow = false;

}

}

/* =========================
   إزالة Service Worker القديم
   حتى لا يبقى الإصدار القديم
   عالقاً في الهاتف
========================= */

if(
"serviceWorker" in navigator
){

navigator
.serviceWorker
.getRegistrations()
.then(function(registrations){

registrations.forEach(
function(registration){

registration.unregister();

}
);

})
.catch(function(error){

console.log(
"Service worker cleanup:",
error
);

});

}


/* حذف الكاش القديم للموقع */

if(
"caches" in window
){

caches.keys()
.then(function(keys){

keys.forEach(function(key){

caches.delete(key);

});

})
.catch(function(error){

console.log(
"Cache cleanup:",
error
);

});

}
