<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest">
<title>كازيات حلب</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f4f7f7;color:#17202a}
header{background:#0f766e;color:#fff;padding:22px 15px 24px}.wrap{max-width:820px;margin:auto}
.brand{font-size:28px;font-weight:900}.sub{margin-top:4px;opacity:.92}.search{margin-top:16px}
.search input{width:100%;padding:14px;border:0;border-radius:13px;font-size:16px}
.filters{display:flex;gap:7px;overflow:auto;padding:14px 0}.filters button{white-space:nowrap;border:1px solid #d7dddd;background:#fff;border-radius:999px;padding:9px 13px}
.filters button.active{background:#0f766e;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:#fff;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e3e9e9;border-radius:16px;padding:15px;box-shadow:0 2px 10px #0000000b}
.name{font-size:19px;font-weight:850}.area{font-size:13px;color:#69767c;margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.badge{padding:6px 9px;border-radius:9px;font-size:12px;font-weight:750}.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}.gray{background:#e5e7eb;color:#374151}
.time{font-size:11px;color:#777;margin-top:10px}.note{font-size:13px;margin-top:9px}
.fab{position:fixed;left:18px;bottom:18px;background:#0f766e;color:#fff;border:0;border-radius:50px;padding:14px 18px;font-weight:800;box-shadow:0 8px 25px #0003}
dialog{border:0;border-radius:18px;width:min(94%,560px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}.modal{padding:20px}
.field{margin:12px 0}.field label{display:block;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d5dddd;border-radius:10px;font:inherit}
.choices{display:flex;gap:7px;flex-wrap:wrap}.choices button{padding:9px 11px;border:1px solid #ccd5d5;background:#fff;border-radius:10px}
.choices button.selected{background:#0f766e;color:#fff}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:800}
.primary{background:#0f766e;color:#fff}.muted{background:#edf1f1}.loading{padding:30px;text-align:center;color:#68757b}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand">⛽ كازيات حلب</div>
<div class="sub">حالة المحطات وآخر تحديثات الوقود</div>
<div class="sub">التحديث الصباحي — الخميس 13 آب 2026 — الساعة 07:00</div>
<div class="search"><input id="search" placeholder="ابحث عن محطة أو منطقة..."></div>
</div></header>
<main class="wrap"><div class="stats" id="stats"></div><div class="filters">
<button class="active" data-f="all">الكل</button><button data-f="open">مفتوحة</button><button data-f="both">بنزين + مازوت</button>
<button data-f="gas">بنزين</button><button data-f="diesel">مازوت</button><button data-f="closed">مغلقة</button>
<button data-f="long">طابور طويل</button><button data-f="light">ازدحام خفيف</button>
</div><div id="count"></div><section class="grid" id="stations"><div class="loading">جاري تحميل البيانات…</div></section></main>
<button class="fab" onclick="openForm()">＋ إضافة تحديث</button>
<dialog id="dlg"><div class="modal"><h2>إرسال تحديث للمراجعة</h2><div id="form"></div><div class="actions"><button class="muted" onclick="dlg.close()">إلغاء</button><button class="primary" onclick="submitUpdate()">إرسال للمراجعة</button></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://hjggfolotblsurfwfcvn.supabase.co";
const SUPABASE_KEY="sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let all=[],filter="all";const dlg=document.getElementById("dlg");
const fallback=[{"name": "محطة الزهرة", "area": "دوار الفيض", "status": "open", "traffic": "none", "gas": "yes", "diesel": "no", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة اكسبريس", "area": "قصر الضيافة", "status": "open", "traffic": "light", "gas": "yes", "diesel": "no", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة أحمد شياح", "area": "دوار برج القلعة", "status": "open", "traffic": "none", "gas": "no", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة النصر", "area": "القصر البلدي", "status": "open", "traffic": "none", "gas": "no", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة سوق الهال القديم", "area": "", "status": "open", "traffic": "none", "gas": "no", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة شام", "area": "اتستراد الحمدانية", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة القدسي", "area": "حي القاطرجي", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة طيبة", "area": "دوار الشعار", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة الشرق", "area": "الشعار", "status": "open", "traffic": "none", "gas": "yes", "diesel": "no", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة السيد", "area": "دوار الجزماتي", "status": "open", "traffic": "none", "gas": "yes", "diesel": "no", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة الاتحاد", "area": "دوار الصاخور", "status": "open", "traffic": "none", "gas": "yes", "diesel": "no", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة خالد البيك", "area": "الشيخ سعيد", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة النورس", "area": "طريق المطار", "status": "open", "traffic": "none", "gas": "yes", "diesel": "no", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة الجلبي", "area": "طريق دمشق", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة القداح", "area": "طريق دمشق", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة زيدو", "area": "طريق دمشق", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة طيبة", "area": "طريق دمشق", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة الرحمة", "area": "خان العسل", "status": "open", "traffic": "none", "gas": "yes", "diesel": "yes", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة البدوي", "area": "طريق اعزاز", "status": "open", "traffic": "none", "gas": "yes", "diesel": "no", "note": "", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة البوابة أوكتان 95", "area": "", "status": "closed", "traffic": "closed", "gas": "no", "diesel": "no", "note": "مغلقة الآن", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة شمس", "area": "العزيزية", "status": "closed", "traffic": "closed", "gas": "no", "diesel": "no", "note": "مغلقة", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة الكنج", "area": "", "status": "closed", "traffic": "closed", "gas": "no", "diesel": "no", "note": "مغلقة", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة الفرقان", "area": "", "status": "closed", "traffic": "closed", "gas": "no", "diesel": "no", "note": "مغلقة", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة بارون", "area": "تتان", "status": "closed", "traffic": "closed", "gas": "no", "diesel": "no", "note": "مغلقة", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة سوريا", "area": "", "status": "closed", "traffic": "closed", "gas": "no", "diesel": "no", "note": "مغلقة", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة الشياح", "area": "دوار الفيض", "status": "closed", "traffic": "closed", "gas": "no", "diesel": "no", "note": "مغلقة", "updated": "13 آب 2026 — 07:00"}, {"name": "محطة سانوسيان", "area": "دوار شيحان", "status": "closed", "traffic": "closed", "gas": "no", "diesel": "no", "note": "مغلقة", "updated": "13 آب 2026 — 07:00"}];
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function tr(v){return v==="none"?["🟢","لا يوجد ازدحام","ok"]:v==="light"?["🟡","ازدحام خفيف","warn"]:v==="long"?["🔴","طابور طويل","no"]:["❌","مغلقة","gray"]}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const a=all.filter(s=>{if(q&&!(s.name+" "+(s.area||"")).toLowerCase().includes(q))return false;
 if(filter==="open")return s.status==="open";if(filter==="closed")return s.status==="closed";if(filter==="both")return s.gas==="yes"&&s.diesel==="yes";
 if(filter==="gas")return s.gas==="yes";if(filter==="diesel")return s.diesel==="yes";if(filter==="long")return s.traffic==="long";if(filter==="light")return s.traffic==="light";return true});
 const open=all.filter(s=>s.status==="open").length,closed=all.length-open,gas=all.filter(s=>s.gas==="yes").length,diesel=all.filter(s=>s.diesel==="yes").length;
 document.getElementById("stats").innerHTML=`<div class="stat"><b>🟢 ${open}</b>مفتوحة</div><div class="stat"><b>🔴 ${closed}</b>مغلقة</div><div class="stat"><b>⛽ ${gas}</b>بنزين</div><div class="stat"><b>🛢️ ${diesel}</b>مازوت</div>`;
 document.getElementById("count").textContent=a.length+" محطة";
 document.getElementById("stations").innerHTML=a.map(s=>{const t=tr(s.traffic);return `<article class="card"><div class="name">${esc(s.name)}</div><div class="area">${esc(s.area||"")}</div>
 <div class="badges"><span class="badge ${s.status==="open"?"ok":"no"}">${s.status==="open"?"🟢 مفتوحة":"❌ مغلقة"}</span>
 <span class="badge ${t[2]}">${t[0]} ${t[1]}</span><span class="badge ${s.gas==="yes"?"ok":"no"}">بنزين: ${s.gas==="yes"?"يوجد":"لا يوجد"}</span>
 <span class="badge ${s.diesel==="yes"?"ok":"no"}">مازوت: ${s.diesel==="yes"?"يوجد":"لا يوجد"}</span></div>
 ${s.note?`<div class="note">📝 ${esc(s.note)}</div>`:""}<div class="time">آخر تحديث: ${new Date(s.updated_at).toLocaleString("ar-SY",{dateStyle:"medium",timeStyle:"short"})}</div></article>`}).join("")||'<div class="loading">لا توجد نتائج.</div>';
}
async function load(){
 const {data,error}=await sb.from("stations").select("*").order("updated_at",{ascending:false});
 if(error||!data?.length){all=fallback.map(x=>({...x,updated_at:"2026-08-13T04:00:00+00:00"}));}
 else all=data;
 render();
}
function choice(g,v,t){return `<button type="button" data-v="${v}" onclick="pick(this)">${t}</button>`}
function pick(el){el.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function openForm(){document.getElementById("form").innerHTML=`
<div class="field"><label>اسم المحطة</label><input id="n"></div><div class="field"><label>المنطقة</label><input id="a"></div>
<div class="field"><label>الحالة</label><div class="choices">${choice("","open","مفتوحة")} ${choice("","closed","مغلقة")}</div></div>
<div class="field"><label>الازدحام</label><div class="choices">${choice("","none","لا يوجد")} ${choice("","light","خفيف")} ${choice("","long","طابور طويل")}</div></div>
<div class="field"><label>البنزين</label><div class="choices">${choice("","yes","يوجد")} ${choice("","no","لا يوجد")}</div></div>
<div class="field"><label>المازوت</label><div class="choices">${choice("","yes","يوجد")} ${choice("","no","لا يوجد")}</div></div>
<div class="field"><label>ملاحظة</label><textarea id="no" rows="3"></textarea></div>`;dlg.showModal()}
async function submitUpdate(){
 const gs=[...document.querySelectorAll(".choices")].map(x=>x.querySelector(".selected")?.dataset.v);
 if(!n.value.trim()||gs.length<4||gs.some(x=>!x))return alert("يرجى تعبئة الحقول الأساسية.");
 const payload={name:n.value.trim(),area:a.value.trim(),status:gs[0],traffic:gs[1],gas:gs[2],diesel:gs[3],note:no.value.trim()};
 const {error}=await sb.from("pending_updates").insert(payload);
 if(error)alert("تعذر إرسال التحديث: "+error.message);else{alert("تم إرسال التحديث للمراجعة ✅");dlg.close()}
}
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.f;render()});
document.getElementById("search").oninput=render;load();
setInterval(load,60000);
</script><script>if("serviceWorker" in navigator && location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
