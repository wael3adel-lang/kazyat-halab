<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#0f766e">

<link rel="manifest" href="manifest.webmanifest">

<title>كازيات حلب</title>


<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
background:#f4f7f7;
color:#17202a
}

header{
background:#0f766e;
color:#fff;
padding:24px 15px
}

.wrap{
max-width:900px;
margin:auto
}


/* =========================
   الترويسة
========================= */

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.brand{
font-size:29px;
font-weight:900
}


/* زر المشرف */

.admin-message{
display:inline-block;
background:transparent;
color:#fff;
border:1px solid rgba(255,255,255,.65);
border-radius:999px;
padding:7px 11px;
font-size:12px;
font-weight:700;
text-decoration:none;
white-space:nowrap
}

.admin-message:hover{
background:rgba(255,255,255,.12)
}


.sub{
margin-top:5px;
opacity:.92
}

.credit{
margin-top:8px;
font-size:12px;
opacity:.75;
font-weight:600
}


/* =========================
   البحث
========================= */

.search{
margin-top:16px
}

.search input{
width:100%;
padding:14px;
border:0;
border-radius:13px;
font-size:16px;
outline:none
}


/* =========================
   الفلاتر
========================= */

.filters{
display:flex;
gap:7px;
overflow:auto;
padding:14px 0
}

.filters button{
white-space:nowrap;
border:1px solid #d7dddd;
background:#fff;
border-radius:999px;
padding:9px 13px;
cursor:pointer;
font:inherit
}

.filters button.active{
background:#0f766e;
color:#fff;
border-color:#0f766e
}


/* =========================
   الإحصائيات
========================= */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:10px
}

.stat{
background:#fff;
border-radius:12px;
padding:9px;
text-align:center
}

.stat b{
display:block;
font-size:21px
}


/* =========================
   المحطات
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:10px
}

.card{
background:#fff;
border:1px solid #e3e9e9;
border-radius:16px;
padding:15px;
box-shadow:0 2px 10px #0000000b
}

.name{
font-size:19px;
font-weight:850
}

.area{
font-size:13px;
color:#69767c;
margin-top:3px
}

.badges{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:11px
}

.badge{
padding:6px 9px;
border-radius:9px;
font-size:12px;
font-weight:750
}

.ok{
background:#dcfce7;
color:#166534
}

.no{
background:#fee2e2;
color:#991b1b
}

.warn{
background:#fef3c7;
color:#92400e
}

.gray{
background:#e5e7eb;
color:#374151
}

.time{
font-size:11px;
color:#777;
margin-top:10px
}

.note{
font-size:13px;
margin-top:9px;
line-height:1.6
}


/* =========================
   الهاتف
========================= */

@media(max-width:600px){

.stats{
grid-template-columns:repeat(2,1fr)
}

.header-top{
align-items:flex-start
}

.brand{
font-size:27px
}

.admin-message{
font-size:11px;
padding:6px 9px
}

}

</style>

</head>


<body>


<header>

<div class="wrap">


<!-- العنوان + زر المشرف -->

<div class="header-top">

<div class="brand">
⛽ كازيات حلب
</div>


<a
class="admin-message"
href="https://wa.me/905050978000?text=مرحباً،%20لدي%20معلومات%20أو%20تحديث%20بخصوص%20كازيات%20حلب:"
target="_blank"
rel="noopener">

📩 المشرف

</a>

</div>


<div class="sub">
حالة المحطات وآخر تحديثات الوقود
</div>


<div class="credit">
By Ammar Morgan
</div>


<div class="sub" id="updatedLine">
آخر تحديث: جاري التحميل…
</div>


<div class="search">

<input
id="search"
type="search"
placeholder="ابحث عن محطة أو منطقة…"
autocomplete="off">

</div>


</div>

</header>



<main class="wrap">


<!-- الإحصائيات -->

<div
class="stats"
id="stats">
</div>



<!-- الفلاتر -->

<div class="filters">


<button
class="active"
data-f="all">

الكل

</button>


<button
data-f="open">

مفتوحة

</button>


<button
data-f="both">

بنزين + مازوت

</button>


<button
data-f="gas">

بنزين

</button>


<button
data-f="diesel">

مازوت

</button>


<button
data-f="closed">

مغلقة

</button>


<button
data-f="long">

طابور طويل

</button>


<button
data-f="light">

ازدحام خفيف

</button>


</div>



<div
id="count"
style="margin-bottom:10px;font-size:13px;color:#68757a">
</div>



<!-- المحطات -->

<section
class="grid"
id="stations">

</section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


/* =========================
   الاتصال بـ Supabase
========================= */

const sb=supabase.createClient(

"https://hjggfolotblsurfwfcvn.supabase.co",

"sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl"

);



/* =========================
   المتغيرات
========================= */

let all=[];

let filter="all";


const $=
id=>document.getElementById(id);



/* =========================
   حماية النصوص
========================= */

function esc(x){

return String(x??"")
.replace(
/[&<>"']/g,

m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])

)

}



/* =========================
   التاريخ والوقت
========================= */

function fmt(t){

if(!t)
return "—";

return new Intl.DateTimeFormat(

"ar-SY",

{

day:"numeric",

month:"numeric",

year:"numeric",

hour:"2-digit",

minute:"2-digit"

}

).format(

new Date(t)

)

}



/* =========================
   حالة الازدحام
========================= */

function tr(v){

if(v==="none"){

return [
"🟢",
"لا يوجد ازدحام",
"ok"
];

}

if(v==="light"){

return [
"🟡",
"ازدحام خفيف",
"warn"
];

}

if(v==="long"){

return [
"🔴",
"طابور طويل",
"no"
];

}

return [
"❌",
"مغلقة",
"gray"
];

}



/* =========================
   عرض المحطات
========================= */

function render(){


const q=
$("search")
.value
.trim()
.toLowerCase();



const a=
all.filter(s=>{


/* البحث */

if(q){

const text=

(

s.name+
" "+
(s.area||"")

)

.toLowerCase();


if(!text.includes(q))
return false;

}



/* مفتوحة */

if(filter==="open"){

return s.status==="open";

}



/* مغلقة */

if(filter==="closed"){

return s.status==="closed";

}



/* بنزين + مازوت */

if(filter==="both"){

return s.gas==="yes" &&
s.diesel==="yes";

}



/* بنزين */

if(filter==="gas"){

return s.gas==="yes";

}



/* مازوت */

if(filter==="diesel"){

return s.diesel==="yes";

}



/* طابور طويل */

if(filter==="long"){

return s.traffic==="long";

}



/* ازدحام خفيف */

if(filter==="light"){

return s.traffic==="light";

}



/* الكل */

return true;

});



/* =========================
   الإحصائيات
========================= */

const open=

all.filter(

s=>s.status==="open"

).length;


const closed=

all.filter(

s=>s.status==="closed"

).length;


const gas=

all.filter(

s=>s.gas==="yes"

).length;


const diesel=

all.filter(

s=>s.diesel==="yes"

).length;



$("stats").innerHTML=`

<div class="stat">

<b>🟢 ${open}</b>

مفتوحة

</div>


<div class="stat">

<b>🔴 ${closed}</b>

مغلقة

</div>


<div class="stat">

<b>⛽ ${gas}</b>

بنزين

</div>


<div class="stat">

<b>🛢️ ${diesel}</b>

مازوت

</div>

`;



/* عدد النتائج */

$("count").textContent=

a.length+
(a.length===1?" محطة":" محطات");



/* =========================
   رسم البطاقات
========================= */

$("stations").innerHTML=

a.map(s=>{


const t=
tr(s.traffic);



return `

<article class="card">


<div class="name">

${esc(s.name)}

</div>


<div class="area">

${esc(s.area||"")}

</div>



<div class="badges">


<span
class="badge ${s.status==="open"?"ok":"no"}">

${
s.status==="open"
?
"🟢 مفتوحة"
:
"❌ مغلقة"
}

</span>



<span
class="badge ${t[2]}">

${t[0]}

${t[1]}

</span>



<span
class="badge ${s.gas==="yes"?"ok":"no"}">

بنزين:

${
s.gas==="yes"
?
"يوجد"
:
"لا يوجد"
}

</span>



<span
class="badge ${s.diesel==="yes"?"ok":"no"}">

مازوت:

${
s.diesel==="yes"
?
"يوجد"
:
"لا يوجد"
}

</span>


</div>



${
s.note
?
`

<div class="note">

📝 ${esc(s.note)}

</div>

`
:
""
}



<div class="time">

آخر تحديث:

${fmt(s.updated_at)}

</div>


</article>

`;

}).join("")


||


`

<div
class="card"
style="text-align:center;color:#777">

لا توجد نتائج.

</div>

`;

}



/* =========================
   تحميل المحطات
========================= */

async function load(){

const {data,error}=

await sb

.from("stations")

.select("*")

.order(

"updated_at",

{

ascending:false

}

);



if(error){

$("stations").innerHTML=

`

<div class="card">

تعذر تحميل البيانات:

<br><br>

${esc(error.message)}

</div>

`;

return;

}



all=data||[];



/* آخر تحديث */

if(all.length){

const latest=

all.reduce(

(a,b)=>{

return new Date(a.updated_at) >

new Date(b.updated_at)

?

a

:

b;

}

);


$("updatedLine").textContent=

"آخر تحديث: "+
fmt(latest.updated_at);

}

else{

$("updatedLine").textContent=
"آخر تحديث: —";

}



render();

}



/* =========================
   الفلاتر
========================= */

document

.querySelectorAll(
".filters button"
)

.forEach(button=>{

button.addEventListener(
"click",
()=>{


document

.querySelectorAll(
".filters button"
)

.forEach(

b=>
b.classList.remove("active")

);



button.classList.add("active");



filter=
button.dataset.f;



render();

}

);

});



/* =========================
   البحث
========================= */

$("search").addEventListener(

"input",

render

);



/* =========================
   تحديث تلقائي
========================= */

/*
   يتم تحديث البيانات كل دقيقة
   حتى تظهر تعديلات أصحاب الكازيات
   للمستخدمين دون الحاجة لإغلاق الموقع.
*/

setInterval(

()=>{

load();

},

60000

);



/* =========================
   تسجيل الزوار
========================= */

async function logVisitor(){

try{


let vid=

localStorage.getItem(
"kazyat_visitor_id"
);



if(!vid){

vid=
crypto.randomUUID();


localStorage.setItem(
"kazyat_visitor_id",
vid
);

}



const day=

new Date()
.toISOString()
.slice(0,10);



const key=

"kazyat_visit_"+day;



if(

localStorage.getItem(key)==="1"

){

return;

}



const {error}=

await sb

.from("visitor_events")

.insert({

visitor_id:vid,

page:"home"

});



if(!error){

localStorage.setItem(
key,
"1"
);

}



}catch(e){

console.log(
"Visitor logging skipped"
);

}

}



/* =========================
   التشغيل
========================= */

load();

logVisitor();


</script>



<script>

/*
   Service Worker
*/

if(

"serviceWorker" in navigator &&

location.protocol!=="file:"

){

navigator

.serviceWorker

.register("./sw.js")

.catch(()=>{});

}

</script>


</body>
</html>
