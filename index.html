<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">

<title>كازيات حلب</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
background:#f4f7f7;
color:#17202a;
}

.wrap{
max-width:900px;
margin:auto;
padding-left:12px;
padding-right:12px;
}

/* الهيدر */

header{
background:#0f766e;
color:#fff;
padding:20px 0 18px;
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.brand{
font-size:28px;
font-weight:900;
}

.admin-message{
display:inline-block;
background:transparent;
color:#fff;
border:1px solid rgba(255,255,255,.65);
border-radius:999px;
padding:6px 10px;
font-size:11px;
font-weight:700;
text-decoration:none;
white-space:nowrap;
}

.sub{
margin-top:5px;
opacity:.92;
font-size:14px;
font-weight:600;
}

.credit{
margin-top:6px;
font-size:11px;
opacity:.75;
font-weight:600;
}

.updated-line{
margin-top:6px;
font-size:12px;
opacity:.95;
}

/* البحث */

.search{
margin-top:14px;
}

.search input{
width:100%;
padding:13px 15px;
border:0;
border-radius:13px;
font-size:15px;
outline:none;
font-family:inherit;
}

/* الفلاتر */

.filters{
display:flex;
gap:7px;
overflow-x:auto;
padding:12px 0;
scrollbar-width:none;
}

.filters::-webkit-scrollbar{
display:none;
}

.filters button{
white-space:nowrap;
border:1px solid #d7dddd;
background:#fff;
border-radius:999px;
padding:8px 13px;
cursor:pointer;
font:inherit;
font-size:14px;
color:#17202a;
}

.filters button.active{
background:#0f766e;
color:#fff;
border-color:#0f766e;
}

/* الإحصائيات */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin:10px 0 5px;
}

.stat{
background:#fff;
border-radius:12px;
padding:8px 5px;
text-align:center;
border:1px solid #e5eaea;
}

.stat b{
display:block;
font-size:19px;
line-height:1.2;
}

.stat span{
display:block;
margin-top:2px;
font-size:11px;
color:#5f6b70;
}

/* العدد */

.count-row{
margin:2px 2px 9px;
font-size:12px;
color:#68757a;
}

/* البطاقات */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:10px;
}

.card{
background:#fff;
border:1px solid #e2e8e8;
border-radius:16px;
padding:13px;
box-shadow:0 2px 8px rgba(0,0,0,.045);
}

/* اسم المحطة */

.card-head{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:10px;
}

.name{
font-size:19px;
font-weight:900;
line-height:1.35;
}

.area{
font-size:12px;
color:#69767c;
margin-top:2px;
}

/* المنطقة داخل البطاقة */

.region{
display:inline-block;
margin-top:5px;
padding:4px 7px;
border-radius:7px;
font-size:10px;
font-weight:800;
}

.region-city{
background:#dbeafe;
color:#1d4ed8;
}

.region-country{
background:#dcfce7;
color:#166534;
}

/* المعلومات */

.main-info{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:11px;
}

.info-badge{
display:inline-flex;
align-items:center;
gap:4px;
padding:7px 9px;
border-radius:9px;
font-size:12px;
font-weight:800;
line-height:1.1;
}

.ok{
background:#dcfce7;
color:#166534;
}

.no{
background:#fee2e2;
color:#991b1b;
}

.warn{
background:#fef3c7;
color:#92400e;
}

.gray{
background:#e5e7eb;
color:#374151;
}

.traffic-badge{
font-weight:900;
}

/* الأزرار */

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:10px;
}

.location-link,
.complaint-link{
display:inline-flex;
align-items:center;
justify-content:center;
text-decoration:none;
border-radius:9px;
padding:7px 10px;
font-size:12px;
font-weight:800;
}

.location-link{
background:#ecfdf5;
color:#047857;
border:1px solid #a7f3d0;
}

.complaint-link{
background:#fff1f2;
color:#be123c;
border:1px solid #fecdd3;
}

/* الملاحظة */

.note{
font-size:12px;
margin-top:9px;
line-height:1.6;
color:#4b5563;
background:#f8fafc;
padding:7px 9px;
border-radius:8px;
}

/* الإغلاق */

.closure-info{
margin-top:9px;
background:#fff7ed;
color:#9a3412;
border-radius:9px;
padding:8px 9px;
font-size:12px;
font-weight:750;
line-height:1.7;
}

/* الوقت */

.time{
font-size:10px;
color:#777;
margin-top:8px;
text-align:left;
}

/* رسالة الخطأ */

.error-box{
background:#fff;
border:1px solid #fecaca;
color:#991b1b;
border-radius:16px;
padding:20px;
text-align:center;
line-height:1.8;
}

.retry{
margin-top:12px;
border:0;
background:#0f766e;
color:#fff;
border-radius:9px;
padding:9px 16px;
font-family:inherit;
font-weight:700;
cursor:pointer;
}

/* الهاتف */

@media(max-width:600px){

.brand{
font-size:25px;
}

.admin-message{
font-size:10px;
padding:5px 8px;
}

.sub{
font-size:13px;
}

.grid{
grid-template-columns:1fr;
gap:8px;
}

.card{
padding:12px;
border-radius:14px;
}

.name{
font-size:18px;
}

.main-info{
gap:5px;
}

.info-badge{
padding:7px 8px;
font-size:11px;
}

.stats{
gap:5px;
}

.stat{
padding:7px 3px;
}

.stat b{
font-size:18px;
}

.stat span{
font-size:10px;
}

}

</style>

</head>

<body>

<header>

<div class="wrap">

<div class="header-top">

<div class="brand">
⛽ كازيات حلب
</div>

<a
class="admin-message"
href="https://wa.me/905050978000?text=مرحباً،%20لدي%20معلومات%20أو%20تحديث%20بخصوص%20كازيات%20حلب"
target="_blank"
rel="noopener">

📩 المشرف

</a>

</div>

<div class="sub">
حالة المحطات وآخر تحديثات الوقود
</div>

<div class="credit">
By Ammar Morgan
</div>

<div
class="updated-line"
id="updatedLine">

آخر تحديث: جاري التحميل…

</div>

<div class="search">

<input
id="search"
type="search"
placeholder="ابحث عن محطة أو منطقة…"
autocomplete="off">

</div>

</div>

</header>


<main class="wrap">

<!-- المنطقة -->

<div class="filters">

<button
class="active"
data-region="city">

🏙️ حلب المدينة

</button>

<button
data-region="countryside">

🌿 ريف حلب

</button>

</div>


<!-- الإحصائيات -->

<div
class="stats"
id="stats">
</div>


<!-- الفلاتر -->

<div class="filters">

<button
class="active"
data-f="all">

الكل

</button>

<button data-f="open">
تعمل
</button>

<button data-f="both">
بنزين + مازوت
</button>

<button data-f="gas">
بنزين
</button>

<button data-f="diesel">
مازوت
</button>

<button data-f="closed">
مغلقة
</button>

<button data-f="none">
لا يوجد ازدحام
</button>

<button data-f="long">
طابور طويل
</button>

<button data-f="light">
ازدحام خفيف
</button>

</div>


<div
class="count-row"
id="count">
</div>


<section
class="grid"
id="stations">

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================================
   SUPABASE
================================================= */

const sb = supabase.createClient(

"https://hjggfolotblsurfwfcvn.supabase.co",

"sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl"

);


/* =================================================
   المتغيرات
================================================= */

let all = [];

let filter = "all";

let regionFilter = "city";

const $ = id =>
document.getElementById(id);


/* =================================================
   حماية النصوص
================================================= */

function esc(x){

return String(x ?? "")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m]));

}


/* =================================================
   التاريخ
================================================= */

function fmt(t){

if(!t)
return "—";

const d = new Date(t);

if(isNaN(d.getTime()))
return "—";

return new Intl.DateTimeFormat(

"ar-SY",

{
day:"numeric",
month:"numeric",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}

).format(d);

}


/* =================================================
   المنطقة
================================================= */

function regionText(v){

const value =
String(v ?? "")
.trim()
.toLowerCase();

if(value === "city")
return "🏙️ مدينة حلب";

if(value === "countryside")
return "🌿 ريف حلب";

return "";

}


/* =================================================
   سبب الإغلاق
================================================= */

function closureReasonText(v){

const value =
String(v ?? "")
.trim()
.toLowerCase();

if(value === "maintenance")
return "🔧 صيانة";

if(value === "technical")
return "⚡ عطل فني";

if(value === "delivery")
return "🚚 بانتظار وصول الطلبية";

if(value === "fuel")
return "⛽ نفاد الوقود";

if(value === "administrative")
return "🏢 إغلاق إداري";

if(value === "temporary")
return "🕐 إغلاق مؤقت";

return "";

}


/* =================================================
   الازدحام
================================================= */

function tr(v){

const value =
String(v ?? "")
.trim()
.toLowerCase();

if(value === "none")
return [
"🟢",
"لا يوجد ازدحام",
"ok"
];

if(value === "light")
return [
"🟡",
"ازدحام خفيف",
"warn"
];

if(value === "long")
return [
"🔴",
"طابور طويل",
"no"
];

return [
"❌",
"مغلقة",
"gray"
];

}


/* =================================================
   الموقع
================================================= */

function locationButton(s){

if(!s.location_url)
return "";

return `

<a
class="location-link"
href="${esc(s.location_url)}"
target="_blank"
rel="noopener">

📍 الموقع

</a>

`;

}


/* =================================================
   الشكوى
================================================= */

function complaintButton(s){

const stationName =
String(s.name ?? "محطة");

const text =
`شكوى بخصوص ${stationName}

أرغب بتقديم شكوى:`;

const url =
"https://wa.me/905050978000?text="+
encodeURIComponent(text);

return `

<a
class="complaint-link"
href="${url}"
target="_blank"
rel="noopener">

📩 شكوى

</a>

`;

}


/* =================================================
   مطابقة المنطقة
================================================= */

function stationMatchesRegion(s){

const region =
String(s.region_type ?? "")
.trim()
.toLowerCase();

/*

مهم جداً:

الآن نعتمد فقط على region_type.

city
= مدينة حلب

countryside
= ريف حلب

*/

if(regionFilter === "countryside"){

return region === "countryside";

}

if(regionFilter === "city"){

return region === "city";

}

return true;

}


/* =================================================
   مطابقة الفلتر
================================================= */

function stationMatchesFilter(s){

const status =
String(s.status ?? "")
.trim()
.toLowerCase();

const gas =
String(s.gas ?? "")
.trim()
.toLowerCase();

const diesel =
String(s.diesel ?? "")
.trim()
.toLowerCase();

const traffic =
String(s.traffic ?? "")
.trim()
.toLowerCase();


if(filter === "open"){

return status === "open";

}


if(filter === "closed"){

return status === "closed";

}


if(filter === "both"){

return (
status === "open" &&
gas === "yes" &&
diesel === "yes"
);

}


if(filter === "gas"){

return (
status === "open" &&
gas === "yes"
);

}


if(filter === "diesel"){

return (
status === "open" &&
diesel === "yes"
);

}


if(filter === "none"){

return (
status === "open" &&
traffic === "none"
);

}


if(filter === "long"){

return (
status === "open" &&
traffic === "long"
);

}


if(filter === "light"){

return (
status === "open" &&
traffic === "light"
);

}


return true;

}


/* =================================================
   عرض المحطات
================================================= */

function render(){

const searchInput =
$("search");

const q =
searchInput
?
searchInput.value
.trim()
.toLowerCase()
:
"";


const filtered =
all.filter(s=>{

const name =
String(s.name ?? "")
.toLowerCase();

const area =
String(s.area ?? "")
.toLowerCase();


if(
q &&
!((name+" "+area).includes(q))
){

return false;

}


if(!stationMatchesRegion(s)){

return false;

}


if(!stationMatchesFilter(s)){

return false;

}


return true;

});


/* الإحصائيات */

const total =
filtered.length;

const open =
filtered.filter(
s=>
String(s.status ?? "")
.trim()
.toLowerCase() === "open"
).length;

const closed =
filtered.filter(
s=>
String(s.status ?? "")
.trim()
.toLowerCase() === "closed"
).length;

const gas =
filtered.filter(
s=>
String(s.status ?? "")
.trim()
.toLowerCase() === "open" &&
String(s.gas ?? "")
.trim()
.toLowerCase() === "yes"
).length;


$("stats").innerHTML = `

<div class="stat">

<b>${total}</b>

<span>إجمالي المحطات</span>

</div>

<div class="stat">

<b>${open}</b>

<span>تعمل</span>

</div>

<div class="stat">

<b>${closed}</b>

<span>مغلقة</span>

</div>

<div class="stat">

<b>${gas}</b>

<span>بنزين</span>

</div>

`;


/* العدد */

$("count").textContent =
total === 0
?
"لا توجد محطات"
:
total === 1
?
"1 محطة"
:
total+" محطات";


/* لا نتائج */

if(!filtered.length){

$("stations").innerHTML = `

<div
class="card"
style="text-align:center;color:#777">

لا توجد محطات ضمن هذا التصنيف.

</div>

`;

return;

}


/* البطاقات */

$("stations").innerHTML =

filtered.map(s=>{

const status =
String(s.status ?? "")
.trim()
.toLowerCase();

const gas =
String(s.gas ?? "")
.trim()
.toLowerCase();

const diesel =
String(s.diesel ?? "")
.trim()
.toLowerCase();

const t =
tr(s.traffic);

const region =
String(s.region_type ?? "")
.trim()
.toLowerCase();


const regionBadge =

region === "countryside"

?

`

<span class="region region-country">

🌿 ريف حلب

</span>

`

:

region === "city"

?

`

<span class="region region-city">

🏙️ مدينة حلب

</span>

`

:

"";


/* المحطة المغلقة */

if(status === "closed"){

return `

<article class="card">

<div class="card-head">

<div>

<div class="name">

${esc(s.name)}

</div>

<div class="area">

${esc(s.area || "")}

</div>

${regionBadge}

</div>

</div>


<div class="main-info">

<span class="info-badge gray">

❌ مغلقة

</span>


${
s.closure_reason
?

`

<span class="info-badge no">

${esc(
closureReasonText(
s.closure_reason
)
)}

</span>

`

:

""

}

</div>


${
s.opening_time
?

`

<div class="closure-info">

🕘 الافتتاح:
${esc(
s.opening_time === "8"
?
"الثامنة صباحاً"
:
s.opening_time === "9"
?
"التاسعة صباحاً"
:
s.opening_time === "order"
?
"مع وصول الطلبية"
:
s.opening_time
)}

</div>

`

:

""

}


${
s.closure_hours
?

`

<div class="closure-info">

⏱️ مدة الإغلاق المتوقعة:
${esc(s.closure_hours)}
ساعة

</div>

`

:

""

}


${
s.note
?

`

<div class="note">

📝 ${esc(s.note)}

</div>

`

:

""

}


<div class="actions">

${locationButton(s)}

${complaintButton(s)}

</div>


<div class="time">

آخر تحديث:
${fmt(s.updated_at)}

</div>


</article>

`;

}


/* المحطة العاملة */

return `

<article class="card">

<div class="card-head">

<div>

<div class="name">

${esc(s.name)}

</div>

<div class="area">

${esc(s.area || "")}

</div>

${regionBadge}

</div>

</div>


<div class="main-info">

<span class="info-badge ok">

🟢 تعمل

</span>


<span class="info-badge ${t[2]} traffic-badge">

${t[0]} ${t[1]}

</span>


<span class="info-badge ${
gas === "yes"
?
"ok"
:
"no"
}">

⛽ بنزين:
${gas === "yes"
?
"يوجد"
:
"لا يوجد"}

</span>


<span class="info-badge ${
diesel === "yes"
?
"ok"
:
"no"
}">

🛢️ مازوت:
${diesel === "yes"
?
"يوجد"
:
"لا يوجد"}

</span>

</div>


${
s.note
?

`

<div class="note">

📝 ${esc(s.note)}

</div>

`

:

""

}


<div class="actions">

${locationButton(s)}

${complaintButton(s)}

</div>


<div class="time">

آخر تحديث:
${fmt(s.updated_at)}

</div>


</article>

`;

}).join("");

}


/* =================================================
   تحميل البيانات
================================================= */

async function load(){

$("updatedLine").textContent =
"آخر تحديث: جاري الاتصال…";


$("stations").innerHTML = `

<div
class="card"
style="text-align:center;color:#777">

جاري تحميل المحطات…

</div>

`;


try{

/*

مهلة 10 ثوانٍ فقط.

إذا لم تستجب Supabase
لا تبقى الصفحة معلقة.

*/

const queryPromise =
sb
.from("stations")
.select("*")
.order(
"updated_at",
{
ascending:false
}
);


const timeoutPromise =
new Promise(resolve=>{

setTimeout(

()=>{

resolve({

data:null,

error:{
message:
"انتهت مهلة الاتصال بقاعدة البيانات."
}

});

},

10000

);

});


const result =
await Promise.race([
queryPromise,
timeoutPromise
]);


if(!result){

throw new Error(
"لم تصل استجابة."
);

}


if(result.error){

console.error(
"Supabase error:",
result.error
);

$("updatedLine").textContent =
"تعذر تحميل البيانات";


$("stations").innerHTML = `

<div class="error-box">

<b>
❌ تعذر تحميل المحطات
</b>

<br><br>

${esc(
result.error.message ||
"خطأ غير معروف"
)}

<br><br>

<button
class="retry"
onclick="load()">

🔄 إعادة المحاولة

</button>

</div>

`;

return;

}


all =
Array.isArray(result.data)
?
result.data
:
[];


if(all.length){

/*

آخر تحديث من جميع المحطات.

*/

let latest =
all[0];

for(
let i=1;
i<all.length;
i++
){

if(
new Date(all[i].updated_at) >
new Date(latest.updated_at)
){

latest =
all[i];

}

}


$("updatedLine").textContent =
"آخر تحديث: "+
fmt(latest.updated_at);

}else{

$("updatedLine").textContent =
"آخر تحديث: —";

}


render();

}catch(error){

console.error(
"Load error:",
error
);


$("updatedLine").textContent =
"حدث خطأ في الاتصال";


$("stations").innerHTML = `

<div class="error-box">

<b>
❌ تعذر تحميل بيانات المحطات
</b>

<br><br>

${esc(
error.message ||
"حدث خطأ غير معروف"
)}

<br><br>

<button
class="retry"
onclick="load()">

🔄 إعادة المحاولة

</button>

</div>

`;
