<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم — كازيات حلب</title>
<style>body{font-family:system-ui;margin:0;background:#f4f7f7;color:#17202a}header{background:#0f766e;color:#fff;padding:22px}main{max-width:1000px;margin:auto;padding:15px}.panel{background:#fff;padding:16px;border-radius:16px;margin:12px 0}input{padding:12px;border:1px solid #ccd5d5;border-radius:10px;width:100%;box-sizing:border-box;margin:6px 0 12px}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer;margin:3px}.primary{background:#0f766e;color:#fff}.danger{background:#fee2e2;color:#991b1b}.row{border-bottom:1px solid #eee;padding:12px 0}small{color:#667}.badge{background:#eef2f2;padding:5px 8px;border-radius:8px;margin:2px;display:inline-block}</style></head>
<body><header><main><h2>⚙️ لوحة تحكم كازيات حلب</h2></main></header><main><div id="app">جاري التحميل…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://hjggfolotblsurfwfcvn.supabase.co","sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl");
let session=null;
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function init(){const {data}=await sb.auth.getSession();session=data.session;if(!session)return login();await load()}
function login(){app.innerHTML=`<div class="panel"><h2>دخول المشرف</h2><label>البريد الإلكتروني</label><input id="email" type="email"><label>كلمة السر</label><input id="password" type="password"><button class="primary" onclick="doLogin()">دخول</button></div>`}
async function doLogin(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return alert(error.message);location.reload()}
async function load(){const {data:me}=await sb.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();if(!me)return app.innerHTML="<div class='panel'>هذا الحساب ليس مشرفاً.</div>";const {data:p,error}=await sb.from("pending_updates").select("*").order("submitted_at",{ascending:false});if(error)return app.innerHTML="<div class='panel'>خطأ: "+esc(error.message)+"</div>";app.innerHTML=`<div class="panel"><b>المشرف:</b> ${esc(session.user.email)} <button onclick="sb.auth.signOut().then(()=>location.reload())">خروج</button></div><div class="panel"><h3>التحديثات المعلقة (${p.length})</h3>${p.length?p.map(x=>`<div class="row"><b>${esc(x.name)}</b> — ${esc(x.area)}<br><span class="badge">${x.status}</span><span class="badge">${x.traffic}</span><span class="badge">بنزين ${x.gas}</span><span class="badge">مازوت ${x.diesel}</span><br><small>${esc(x.note||"")}</small><br><button class="primary" onclick="approve('${x.id}')">اعتماد</button><button class="danger" onclick="reject('${x.id}')">رفض</button></div>`).join(""):"لا توجد تحديثات معلقة."}</div>`}
async function approve(id){const {data:p}=await sb.from("pending_updates").select("*").eq("id",id).single();if(!p)return;const {data:old}=await sb.from("stations").select("id").eq("name",p.name).eq("area",p.area).maybeSingle();let e;if(old)e=await sb.from("stations").update({status:p.status,traffic:p.traffic,gas:p.gas,diesel:p.diesel,note:p.note,updated_at:new Date().toISOString()}).eq("id",old.id);else e=await sb.from("stations").insert({name:p.name,area:p.area,status:p.status,traffic:p.traffic,gas:p.gas,diesel:p.diesel,note:p.note});if(e.error)return alert(e.error.message);await sb.from("pending_updates").delete().eq("id",id);load()}
async function reject(id){await sb.from("pending_updates").delete().eq("id",id);load()}
init();
</script><script>if("serviceWorker" in navigator && location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
