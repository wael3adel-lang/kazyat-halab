<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const sb=supabase.createClient(
"https://hjggfolotblsurfwfcvn.supabase.co",
"sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl"
);

let session=null;
let stations=[];
let currentRole=null;
let currentStationId=null;

const $=id=>document.getElementById(id);


/* =========================
   حماية النصوص
========================= */

function esc(x){

return String(x??"")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]))

}


/* =========================
   التاريخ
========================= */

function fmt(t){

if(!t)return "—";

return new Intl.DateTimeFormat("ar-SY",{
day:"numeric",
month:"numeric",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}).format(new Date(t))

}


/* =========================
   موعد الافتتاح
========================= */

function openingText(v){

if(v==="8")return "الثامنة صباحاً";
if(v==="9")return "التاسعة صباحاً";
if(v==="order")return "مع وصول الطلبية";

return "";

}


/* =========================
   إرسال إشعار Telegram
========================= */

async function notifyTelegram(station){

try{

const changes=[];


/* الحالة */

if(station.status==="closed"){

changes.push(
"❌ <b>الحالة:</b> مغلقة"
);

if(station.opening_time){

changes.push(
"🕘 <b>الافتتاح:</b> "+
esc(openingText(station.opening_time))
);

}

}else{

changes.push(
"🟢 <b>الحالة:</b> مفتوحة"
);


/* البنزين */

if(station.gas==="yes"){

changes.push(
"⛽ <b>البنزين:</b> يوجد"
);

}else{

changes.push(
"⛽ <b>البنزين:</b> لا يوجد"
);

}


/* المازوت */

if(station.diesel==="yes"){

changes.push(
"🛢️ <b>المازوت:</b> يوجد"
);

}else{

changes.push(
"🛢️ <b>المازوت:</b> لا يوجد"
);

}


/* الازدحام */

if(station.traffic==="none"){

changes.push(
"🟢 <b>الازدحام:</b> لا يوجد ازدحام"
);

}

else if(station.traffic==="light"){

changes.push(
"🟡 <b>الازدحام:</b> ازدحام خفيف"
);

}

else if(station.traffic==="long"){

changes.push(
"🔴 <b>الازدحام:</b> طابور طويل"
);

}

}


/* الملاحظة */

if(station.note){

changes.push(
"📝 <b>ملاحظة:</b> "+
esc(station.note)
);

}


/* إرسال الطلب */

const {data,error}=await sb.functions.invoke(
"notify-telegram",
{
body:{
station_name:station.name,
area:station.area||"",
changes:changes
}
}
);


if(error){

console.error(
"Telegram notification error:",
error
);

return false;

}


console.log(
"Telegram notification sent:",
data
);

return true;

}catch(err){

console.error(
"Telegram notification exception:",
err
);

return false;

}

}


/* =========================
   تسجيل الدخول
========================= */

function login(){

$("app").innerHTML=`

<div class="panel">

<h2>تسجيل الدخول</h2>

<label>البريد الإلكتروني</label>

<input id="email" type="email">

<label>كلمة المرور</label>

<input id="password" type="password">

<button class="primary" onclick="doLogin()">
دخول
</button>

</div>
`;

}


async function doLogin(){

const {error}=await sb.auth.signInWithPassword({

email:$("email").value.trim(),

password:$("password").value

});

if(error){

alert(error.message);

return;

}

location.reload();

}


/* =========================
   البداية
========================= */

async function init(){

const {data}=await sb.auth.getSession();

session=data.session;

if(!session){

login();

return;

}


const {data:me,error}=await sb

.from("admin_users")

.select("user_id,role,station_id")

.eq("user_id",session.user.id)

.maybeSingle();


if(error){

$("app").innerHTML=`

<div class="panel">

خطأ في الصلاحيات:

<br><br>

${esc(error.message)}

</div>
`;

return;

}


if(!me){

$("app").innerHTML=`

<div class="panel">

هذا الحساب ليس مشرفاً.

</div>
`;

return;

}


currentRole=me.role||"admin";

currentStationId=me.station_id;


if(currentRole==="station_owner"){

loadOwner();

}else{

loadAdmin();

}

}

<label>المازوت</label>

</option>

</select>

</div>


<div id="ownerClosedFields">

<label>
الافتتاح
</label>

<select id="ownerOpening">

<option value="">
اختر موعد الافتتاح
</option>

<option value="8" ${s.opening_time==="8"?"selected":""}>
الثامنة صباحاً
</option>

<option value="9" ${s.opening_time==="9"?"selected":""}>

</option>

مع وصول الطلبية
</option>

</select>

<div class="muted">

<br>

<button
class="primary"
style="width:100%;font-size:17px;padding:13px"
onclick="saveOwner()">

💾 حفظ تحديث الكازية

id="ownerMessage"

/* =========================
   تفعيل / تعطيل حقول صاحب الكازية
========================= */

function toggleOwnerFields(){

const closed=
$("ownerStatus").value==="closed";


$("ownerOpenFields").style.display=
closed?"none":"block";


$("ownerClosedFields").style.display=
closed?"block":"none";


if($("ownerGas"))
$("ownerGas").disabled=closed;

if($("ownerDiesel"))
$("ownerDiesel").disabled=closed;

if($("ownerTraffic"))
$("ownerTraffic").disabled=closed;

}


/* =========================
   حفظ صاحب الكازية
========================= */

async function saveOwner(){

if(currentRole!=="station_owner"){

alert("ليس لديك صلاحية.");

return;

}


const closed=
$("ownerStatus").value==="closed";


let opening="";


if(closed){

opening=$("ownerOpening").value;

if(!opening){

alert("اختر موعد الافتتاح.");

return;

}

}


const payload={

status:
$("ownerStatus").value,

opening_time:
opening,

updated_at:
new Date().toISOString()

};


/*
عند الإغلاق لا نغيّر بيانات
البنزين والمازوت والازدحام،
بل نخفيها فقط.
*/

if(!closed){

payload.gas=$("ownerGas").value;

payload.diesel=$("ownerDiesel").value;

payload.traffic=$("ownerTraffic").value;

}else{

payload.traffic="closed";

}


const {error}=await sb

.from("stations")

.update(payload)

.eq("id",currentStationId);


if(error){

$("ownerMessage").innerHTML=`

<span style="color:#b91c1c">

❌ لم يتم الحفظ:

${esc(error.message)}

</span>
`;

return;

}


/* =========================
   تجهيز بيانات المحطة للإشعار
========================= */

const updatedStation={

...stations[0],

...payload,

name:stations[0].name,

area:stations[0].area,

note:stations[0].note||""

};


/* تحديث النسخة المحلية */

stations=[updatedStation];


/* =========================
   إرسال Telegram
========================= */

const telegramOk=
await notifyTelegram(updatedStation);


/* =========================
   رسالة النجاح
========================= */

$("ownerMessage").innerHTML=`

<span style="color:#166534;font-weight:700">

✅ تم تحديث الكازية بنجاح

<br>

${
telegramOk
?
"📲 تم إرسال إشعار Telegram"
:
"⚠️ تم الحفظ لكن تعذر إرسال إشعار Telegram"
}

</span>
`;


setTimeout(loadOwner,1500);

}

/* =========================
   المشرف: فتح تعديل
========================= */

function openEdit(id){

const s=stations.find(
x=>String(x.id)===String(id)
);

if(!s)return;


$("dlgTitle").textContent="تعديل محطة";

$("sid").value=s.id;

$("name").value=s.name;

$("area").value=s.area||"";

$("status").value=s.status;

$("traffic").value=
s.traffic==="closed"
?"none"
:s.traffic;

$("gas").value=s.gas;

$("diesel").value=s.diesel;

$("note").value=s.note||"";

$("opening_time").value=s.opening_time||"";

toggleAdminOpening();

stationDlg.showModal();

}


/* =========================
   إضافة
========================= */

function openAdd(){

$("dlgTitle").textContent="إضافة محطة";

$("stationForm").reset();

$("sid").value="";

$("status").value="open";

$("opening_time").value="";

toggleAdminOpening();

stationDlg.showModal();

}


/* =========================
   حالة نافذة المشرف
========================= */

function toggleAdminOpening(){

const closed=
$("status").value==="closed";


$("adminOpeningBox").classList.toggle(
"hidden",
!closed
);


$("adminFuelBox").style.opacity=
closed?".5":"1";


$("traffic").disabled=closed;

$("gas").disabled=closed;

$("diesel").disabled=closed;


if(closed){

$("traffic").value="closed";

}else{

if($("traffic").value==="closed")
$("traffic").value="none";

}

}


/* =========================
   حفظ محطة المشرف
========================= */

$("stationForm").onsubmit=async e=>{

e.preventDefault();


const id=$("sid").value;

const closed=
$("status").value==="closed";


let opening="";


if(closed){

opening=$("opening_time").value;

if(!opening){

alert("اختر موعد الافتتاح.");

return;

}

}


const payload={

name:$("name").value.trim(),

area:$("area").value.trim(),

status:$("status").value,

opening_time:opening,

note:$("note").value,

updated_at:new Date().toISOString()

};


if(!closed){

payload.traffic=$("traffic").value;

payload.gas=$("gas").value;

payload.diesel=$("diesel").value;

}else{

payload.traffic="closed";

}


let result;


if(id){

result=await sb

.from("stations")

.update(payload)

.eq("id",id);

}else{

result=await sb

.from("stations")

.insert(payload);

}


if(result.error){

alert(result.error.message);

return;

}


stationDlg.close();

loadAdmin();

};


/* =========================
   حذف
========================= */

async function removeStation(id){

if(!confirm("هل أنت متأكد من حذف هذه المحطة؟"))
return;


const {error}=await sb

.from("stations")

.delete()

.eq("id",id);


if(error){

alert(error.message);

return;

}


loadAdmin();

}


/* =========================
   اعتماد تحديث
========================= */

async function approve(id){

const {data:p,error}=await sb

.from("pending_updates")

.select("*")

.eq("id",id)

.single();


if(error||!p){

alert(
error?.message||
"لم يتم العثور على التحديث."
);

return;

}


const {data:old}=await sb

.from("stations")

.select("id")

.eq("name",p.name)

.eq("area",p.area)

.maybeSingle();


let result;


if(old){

result=await sb

.from("stations")

.update({

status:p.status,

traffic:
p.status==="closed"
?"closed"
:p.traffic,

gas:p.gas,

diesel:p.diesel,

updated_at:new Date().toISOString()

})

.eq("id",old.id);

}else{

result=await sb

.from("stations")

.insert({

name:p.name,

area:p.area,

status:p.status,

traffic:p.traffic,

gas:p.gas,

diesel:p.diesel,

updated_at:new Date().toISOString()

});

}


if(result.error){

alert(result.error.message);

return;

}


await sb

.from("pending_updates")

.delete()

.eq("id",id);


loadAdmin();

}


/* =========================
   رفض
========================= */

async function reject(id){

const {error}=await sb

.from("pending_updates")

.delete()

.eq("id",id);


if(error){

alert(error.message);

return;

}


loadAdmin();

}


/* =========================
   خروج
========================= */

async function logout(){

await sb.auth.signOut();

location.reload();

}


init();

</script>
