<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const sb=supabase.createClient(
"https://hjggfolotblsurfwfcvn.supabase.co",
"sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl"
);

let session=null;
let stations=[];
let currentRole=null;
let currentStationId=null;

const $=id=>document.getElementById(id);


function esc(x){

return String(x??"")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]))

}


function fmt(t){

if(!t)return "—";

return new Intl.DateTimeFormat("ar-SY",{
day:"numeric",
month:"numeric",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}).format(new Date(t))

}


function openingText(v){

if(v==="8")return "الثامنة صباحاً";
if(v==="9")return "التاسعة صباحاً";
if(v==="order")return "مع وصول الطلبية";

return "";

}


function closureReasonText(v){

if(v==="maintenance")return "🔧 صيانة";
if(v==="technical")return "⚡ عطل فني";
if(v==="delivery")return "🚚 بانتظار وصول الطلبية";
if(v==="fuel")return "⛽ نفاد الوقود";
if(v==="administrative")return "🏢 إغلاق إداري";
if(v==="temporary")return "🕐 إغلاق مؤقت";

return "";

}


/* =========================
   إشعار Telegram
========================= */

async function notifyTelegram(station){

try{

const changes=[];


if(station.status==="closed"){

changes.push(
"❌ <b>الحالة:</b> مغلقة"
);


if(station.closure_reason){

changes.push(
"🔧 <b>سبب الإغلاق:</b> "+
esc(closureReasonText(station.closure_reason))
);

}


if(station.closure_hours){

changes.push(
"⏱️ <b>مدة الإغلاق المتوقعة:</b> "+
esc(station.closure_hours)+
" ساعة"
);

}


}else{

changes.push(
"🟢 <b>الحالة:</b> تعمل"
);

changes.push(
"⛽ <b>البنزين:</b> "+
(station.gas==="yes"?"يوجد":"لا يوجد")
);

changes.push(
"🛢️ <b>المازوت:</b> "+
(station.diesel==="yes"?"يوجد":"لا يوجد")
);


if(station.traffic==="none")
changes.push(
"🟢 <b>الازدحام:</b> لا يوجد ازدحام"
);

else if(station.traffic==="light")
changes.push(
"🟡 <b>الازدحام:</b> ازدحام خفيف"
);

else if(station.traffic==="long")
changes.push(
"🔴 <b>الازدحام:</b> طابور طويل"
);

}


if(station.note){

changes.push(
"📝 <b>ملاحظة:</b> "+
esc(station.note)
);

}


const {data,error}=await sb.functions.invoke(
"notify-telegram",
{
body:{
station_name:station.name,
area:station.area||"",
changes
}
}
);


if(error){

console.error(
"Telegram notification error:",
error
);

return false;

}


console.log(
"Telegram notification sent:",
data
);

return true;

}catch(err){

console.error(
"Telegram notification exception:",
err
);

return false;

}

}

function login(){

$("app").innerHTML=`

<label>البريد الإلكتروني</label>

دخول
</button>

`;

async function doLogin(){

const {error}=await sb.auth.signInWithPassword({

email:$("email").value.trim(),

password:$("password").value

});

if(error){

alert(error.message);

return;

}

location.reload();

}


/* =========================
   البداية
========================= */

async function init(){

const {data}=await sb.auth.getSession();

session=data.session;

if(!session){

login();

return;

}


const {data:me,error}=await sb

.from("admin_users")

.select("user_id,role,station_id")

.eq("user_id",session.user.id)

.maybeSingle();


if(error){

$("app").innerHTML=`

<div class="panel">

خطأ في الصلاحيات:

<br><br>

${esc(error.message)}

</div>

`;

return;

}


if(!me){

$("app").innerHTML=`

<div class="panel">

هذا الحساب ليس مشرفاً.

</div>

`;

return;

}


currentRole=me.role||"admin";

currentStationId=me.station_id;


if(currentRole==="station_owner"){

loadOwner();

}else{

loadAdmin();

}

}

/* =========================
   حقول صاحب الكازية
========================= */

function toggleOwnerFields(){

const closed=
$("ownerStatus").value==="closed";


$("ownerOpenFields").style.display=
closed?"none":"block";


$("ownerClosedFields").style.display=
closed?"block":"none";


if($("ownerGas"))
$("ownerGas").disabled=closed;


if($("ownerDiesel"))
$("ownerDiesel").disabled=closed;


if($("ownerTraffic"))
$("ownerTraffic").disabled=closed;

}


/* =========================
   حفظ صاحب الكازية
========================= */

async function saveOwner(){

if(currentRole!=="station_owner"){

alert("ليس لديك صلاحية.");

return;

}


const closed=
$("ownerStatus").value==="closed";


let closureReason=null;

let closureHours=null;


if(closed){

closureReason=
$("ownerClosureReason").value;


closureHours=
parseInt(
$("ownerClosureHours").value,
10
);


if(!closureReason){

alert("اختر سبب الإغلاق.");

return;

}


if(
!Number.isInteger(closureHours) ||
closureHours<1 ||
closureHours>48
){

alert(
"أدخل مدة إغلاق متوقعة من 1 إلى 48 ساعة."
);

return;

}

}


const payload={

status:
$("ownerStatus").value,

closure_reason:
closureReason,

closure_hours:
closureHours,

updated_at:
new Date().toISOString()

};


if(!closed){

payload.gas=
$("ownerGas").value;

payload.diesel=
$("ownerDiesel").value;

payload.traffic=
$("ownerTraffic").value;

payload.opening_time="";

}else{

payload.traffic="closed";

payload.opening_time="";

}


const {error}=await sb

.from("stations")

.update(payload)

.eq("id",currentStationId);


if(error){

$("ownerMessage").innerHTML=`

<span style="color:#b91c1c">

❌ لم يتم الحفظ:

<br>

${esc(error.message)}

</span>

`;

return;

}


const updatedStation={
...stations[0],
...payload,
name:stations[0].name,
area:stations[0].area,
note:stations[0].note||""
};


stations=[updatedStation];


const telegramOk=
await notifyTelegram(updatedStation);


$("ownerMessage").innerHTML=`

<span style="color:#166534;font-weight:700">

✅ تم تحديث الكازية بنجاح

<br>

${
telegramOk
?"📲 تم إرسال إشعار Telegram"
:"⚠️ تم الحفظ لكن تعذر إرسال إشعار Telegram"
}

</span>

`;


setTimeout(
loadOwner,
1500
);

}

rel="noopener"
class="badge ok">

📍 فتح الموقع

</a>

`

:

""

}


${
s.note

?

`

<div
class="badge"
style="margin-top:8px;white-space:normal">

📝 ${esc(s.note)}

</div>

`

:

""

}


<div class="actions">

<button onclick="openEdit('${s.id}')">
✏️ تعديل
</button>

<button
class="danger"
onclick="removeStation('${s.id}')">

🗑️ حذف

</button>

</div>


</div>

`).join("")}

</div>

</div>

`;

}


/* =========================
   المشرف: فتح تعديل
========================= */

function openEdit(id){

const s=stations.find(
x=>String(x.id)===String(id)
);

if(!s)return;


$("dlgTitle").textContent="تعديل محطة";

$("sid").value=s.id;

$("name").value=s.name;

$("area").value=s.area||"";

$("location_url").value=
s.location_url||"";

$("status").value=s.status;

$("traffic").value=
s.traffic==="closed"
?"none"
:s.traffic;

$("gas").value=s.gas;

$("diesel").value=s.diesel;

$("note").value=s.note||"";

$("opening_time").value=
s.opening_time||"";

$("closure_reason").value=
s.closure_reason||"";

$("closure_hours").value=
s.closure_hours||"";

toggleAdminOpening();

stationDlg.showModal();

}


/* =========================
   إضافة محطة
========================= */

function openAdd(){

$("dlgTitle").textContent="إضافة محطة";

$("stationForm").reset();

$("sid").value="";

$("status").value="open";

$("opening_time").value="";

$("location_url").value="";

$("closure_reason").value="";

$("closure_hours").value="";

toggleAdminOpening();

stationDlg.showModal();

}


/* =========================
   حالة نافذة المشرف
========================= */

function toggleAdminOpening(){

const closed=
$("status").value==="closed";


$("adminOpeningBox").classList.toggle(
"hidden",
!closed
);


$("adminClosureBox").classList.toggle(
"hidden",
!closed
);


$("adminFuelBox").style.opacity=
closed?".5":"1";


$("traffic").disabled=closed;

$("gas").disabled=closed;

$("diesel").disabled=closed;


if(closed){

$("traffic").value="closed";

}else{

if($("traffic").value==="closed")
$("traffic").value="none";

}

}


/* =========================
   حفظ محطة المشرف
========================= */

$("stationForm").onsubmit=async e=>{

e.preventDefault();


const id=$("sid").value;

const closed=
$("status").value==="closed";


let opening="";

let closureReason=null;

let closureHours=null;


if(closed){

opening=
$("opening_time").value;


if(!opening){

alert("اختر موعد الافتتاح.");

return;

}


closureReason=
$("closure_reason").value;


closureHours=
parseInt(
$("closure_hours").value,
10
);


if(!closureReason){

alert("اختر سبب الإغلاق.");

return;

}


if(
!Number.isInteger(closureHours) ||
closureHours<1 ||
closureHours>48
){

alert(
"أدخل مدة إغلاق متوقعة من 1 إلى 48 ساعة."
);

return;

}

}


const locationUrl=
$("location_url").value.trim();


if(
locationUrl &&
!/^https?:\/\//i.test(locationUrl)
){

alert(
"ضع رابطاً صحيحاً يبدأ بـ https://"
);

return;

}


const payload={

name:
$("name").value.trim(),

area:
$("area").value.trim(),

location_url:
locationUrl,

status:
$("status").value,

opening_time:
opening,

closure_reason:
closureReason,

closure_hours:
closureHours,

note:
$("note").value,

updated_at:
new Date().toISOString()

};


if(!closed){

payload.traffic=
$("traffic").value;

payload.gas=
$("gas").value;

payload.diesel=
$("diesel").value;

}else{

payload.traffic="closed";

}


let result;


if(id){

result=await sb

.from("stations")

.update(payload)

.eq("id",id);

}else{

result=await sb

.from("stations")

.insert(payload);

}


if(result.error){

alert(result.error.message);

return;

}


stationDlg.close();

loadAdmin();

};


/* =========================
   حذف
========================= */

async function removeStation(id){

if(!confirm(
"هل أنت متأكد من حذف هذه المحطة؟"
))
return;


const {error}=await sb

.from("stations")

.delete()

.eq("id",id);


if(error){

alert(error.message);

return;

}


loadAdmin();

}


/* =========================
   اعتماد تحديث
========================= */

async function approve(id){

const {data:p,error}=await sb

.from("pending_updates")

.select("*")

.eq("id",id)

.single();


if(error||!p){

alert(
error?.message||
"لم يتم العثور على التحديث."
);

return;

}


const {data:old}=await sb

.from("stations")

.select("id")

.eq("name",p.name)

.eq("area",p.area)

.maybeSingle();


let result;


if(old){

result=await sb

.from("stations")

.update({

status:p.status,

traffic:
p.status==="closed"
?"closed"
:p.traffic,

gas:p.gas,

diesel:p.diesel,

updated_at:
new Date().toISOString()

})

.eq("id",old.id);

}else{

result=await sb

.from("stations")

.insert({

name:p.name,

area:p.area,

status:p.status,

traffic:p.traffic,

gas:p.gas,

diesel:p.diesel,

updated_at:
new Date().toISOString()

});

}


if(result.error){

alert(result.error.message);

return;

}


await sb

.from("pending_updates")

.delete()

.eq("id",id);


loadAdmin();

}


/* =========================
   رفض
========================= */

async function reject(id){

const {error}=await sb

.from("pending_updates")

.delete()

.eq("id",id);


if(error){

alert(error.message);

return;

}


loadAdmin();

}


/* =========================
   خروج
========================= */

async function logout(){

await sb.auth.signOut();

location.reload();

}


init();

</script>

</body>
</html>
