<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم — كازيات حلب</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f4f7f7;color:#17202a}header{background:#0f766e;color:#fff;padding:22px}main{max-width:1050px;margin:auto;padding:15px}
.panel{background:#fff;padding:16px;border-radius:16px;margin:12px 0;box-shadow:0 2px 10px #0000000b}input,select,textarea{padding:11px;border:1px solid #ccd5d5;border-radius:10px;width:100%;margin:5px 0 10px;font:inherit}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer;margin:3px}.primary{background:#0f766e;color:#fff}.danger{background:#fee2e2;color:#991b1b}.muted{color:#68757a}.row{border-bottom:1px solid #eee;padding:13px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}.badge{background:#eef2f2;padding:5px 8px;border-radius:8px;margin:2px;display:inline-block;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog{border:0;border-radius:18px;width:min(650px,94vw);padding:0;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}.form{padding:20px}@media(max-width:600px){.two{grid-template-columns:1fr}}
</style></head><body>
<header><main><h2>⚙️ لوحة تحكم كازيات حلب</h2></main></header><main><div id="app">جاري التحميل…</div></main>
<dialog id="stationDlg"><form class="form" id="stationForm"><h2 id="dlgTitle">تعديل محطة</h2><input type="hidden" id="sid">
<label>اسم المحطة</label><input id="name" required><label>المنطقة</label><input id="area">
<div class="two"><div><label>الحالة</label><select id="status"><option value="open">مفتوحة</option><option value="closed">مغلقة</option></select></div>
<div><label>الازدحام</label><select id="traffic"><option value="none">لا يوجد ازدحام</option><option value="light">ازدحام خفيف</option><option value="long">طابور طويل</option><option value="closed">مغلقة</option></select></div></div>
<div class="two"><div><label>البنزين</label><select id="gas"><option value="yes">يوجد</option><option value="no">لا يوجد</option></select></div>
<div><label>المازوت</label><select id="diesel"><option value="yes">يوجد</option><option value="no">لا يوجد</option></select></div></div>
<label>ملاحظة</label><textarea id="note"></textarea><div><button class="primary" type="submit">حفظ التغيير</button><button type="button" onclick="stationDlg.close()">إلغاء</button></div></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://hjggfolotblsurfwfcvn.supabase.co","sb_publishable_UTpiWf5wrq8VfxAXxl9zfw_CtRRizyl");let session=null,stations=[];
const $=id=>document.getElementById(id);
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(t){return new Intl.DateTimeFormat("ar-SY",{day:"numeric",month:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(t))}
function login(){app.innerHTML=`<div class="panel"><h2>دخول المشرف</h2><label>البريد الإلكتروني</label><input id="email" type="email"><label>كلمة السر</label><input id="password" type="password"><button class="primary" onclick="doLogin()">دخول</button></div>`}
async function doLogin(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return alert(error.message);location.reload()}
async function init(){const {data}=await sb.auth.getSession();session=data.session;if(!session)return login();const {data:me,error}=await sb.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();if(error)return app.innerHTML="<div class='panel'>خطأ في صلاحيات المشرف: "+esc(error.message)+"</div>";if(!me)return app.innerHTML="<div class='panel'>هذا الحساب ليس مشرفاً.</div>";await load()}
async function load(){const {data:p,error:pe}=await sb.from("pending_updates").select("*").order("submitted_at",{ascending:false});const {data:s,error:se}=await sb.from("stations").select("*").order("name");if(pe||se)return app.innerHTML="<div class='panel'>خطأ: "+esc((pe||se).message)+"</div>";stations=s||[];app.innerHTML=`<div class="panel"><b>المشرف:</b> ${esc(session.user.email)} <button onclick="sb.auth.signOut().then(()=>location.reload())">خروج</button></div>
<div class="panel"><h3>التحديثات المعلقة (${p.length})</h3>${p.length?p.map(x=>`<div class="row"><b>${esc(x.name)}</b> — ${esc(x.area||"")}<br><span class="badge">${x.status}</span><span class="badge">${x.traffic}</span><span class="badge">بنزين ${x.gas}</span><span class="badge">مازوت ${x.diesel}</span><br><small class="muted">${esc(x.note||"")}</small><div class="actions"><button class="primary" onclick="approve('${x.id}')">اعتماد ✅</button><button class="danger" onclick="reject('${x.id}')">رفض ❌</button></div></div>`).join(""):"لا توجد تحديثات معلقة."}</div>
<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>المحطات (${stations.length})</h3><button class="primary" onclick="openAdd()">＋ إضافة محطة</button></div><div class="grid">${stations.map(s=>`<div class="row"><b>${esc(s.name)}</b><br><small class="muted">${esc(s.area||"")}</small><div>
<span class="badge">${s.status==="open"?"🟢 مفتوحة":"❌ مغلقة"}</span>
<span class="badge">⛽ بنزين: ${s.gas==="yes"?"يوجد":"لا يوجد"}</span>
<span class="badge">🛢️ مازوت: ${s.diesel==="yes"?"يوجد":"لا يوجد"}</span>
</div><small>الازدحام: ${s.traffic==="long"?"🔴 طابور طويل":s.traffic==="light"?"🟡 ازدحام خفيف":"🟢 لا يوجد ازدحام"}</small><br><small>آخر تحديث: ${fmt(s.updated_at)}</small><div class="actions"><button onclick="openEdit('${s.id}')">✏️ تعديل</button><button class="danger" onclick="removeStation('${s.id}')">🗑️ حذف</button></div></div>`).join("")}</div></div>`}
async function approve(id){const {data:p}=await sb.from("pending_updates").select("*").eq("id",id).single();if(!p)return;const {data:old}=await sb.from("stations").select("id").eq("name",p.name).eq("area",p.area).maybeSingle();let r;if(old)r=await sb.from("stations").update({status:p.status,traffic:p.traffic,gas:p.gas,diesel:p.diesel,note:p.note,updated_at:new Date().toISOString()}).eq("id",old.id);else r=await sb.from("stations").insert({name:p.name,area:p.area,status:p.status,traffic:p.traffic,gas:p.gas,diesel:p.diesel,note:p.note,updated_at:new Date().toISOString()});if(r.error)return alert(r.error.message);await sb.from("pending_updates").delete().eq("id",id);load()}
async function reject(id){const {error}=await sb.from("pending_updates").delete().eq("id",id);if(error)return alert(error.message);load()}
function openAdd(){$("dlgTitle").textContent="إضافة محطة";$("sid").value="";$("stationForm").reset();stationDlg.showModal()}
function openEdit(id){const s=stations.find(x=>String(x.id)===String(id));if(!s)return;$("dlgTitle").textContent="تعديل محطة";$("sid").value=s.id;$("name").value=s.name;$("area").value=s.area||"";$("status").value=s.status;$("traffic").value=s.traffic;$("gas").value=s.gas;$("diesel").value=s.diesel;$("note").value=s.note||"";stationDlg.showModal()}
$("stationForm").onsubmit=async e=>{e.preventDefault();const id=$("sid").value;const payload={name:$("name").value.trim(),area:$("area").value.trim(),status:$("status").value,traffic:$("traffic").value,gas:$("gas").value,diesel:$("diesel").value,note:$("note").value,updated_at:new Date().toISOString()};let r=id?await sb.from("stations").update(payload).eq("id",id):await sb.from("stations").insert(payload);if(r.error)return alert(r.error.message);stationDlg.close();load()}
async function removeStation(id){if(!confirm("هل تريد حذف هذه المحطة؟"))return;const {error}=await sb.from("stations").delete().eq("id",id);if(error)return alert(error.message);load()}
init();
</script></body></html>
